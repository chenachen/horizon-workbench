function createHorizonPluginCenter({icon, go, act, ab, pill, note, field, input, select, row, escape, dialogFrame:hostDialogFrame, navigate, paint, toast, project, screen}) {
  const closeKey=()=>screen()==='plugin-update-permissions'?'plugin-updates':screen()==='plugin-install'?'plugins':'plugin-installed';

  const catalog = [
    {id:'terminal',name:'集成终端',english:'Terminal',icon:'terminal',category:'工具',author:'Horizon',version:'0.3.0',summary:'在项目目录运行命令，随时收起，再从原处继续。',trigger:'打开终端面板时',contributions:['底部面板：终端','命令：新建终端 / 结束进程'],permissions:[['terminal','运行本地进程','使用当前项目的 Shell 与环境变量。']],installed:true,enabled:true,runtime:'运行中',scope:'global'},
    {id:'language',name:'语言增强',english:'Language Tools',icon:'braces',category:'语言',author:'Horizon',version:'0.3.1',next:'0.4.0',summary:'按语言加载补全、诊断、符号导航和重命名。',trigger:'打开支持的源文件时',contributions:['编辑器：补全 / 诊断 / 重命名','侧栏：文件结构','命令：重启语言服务'],permissions:[['folder-open','读取项目文件','分析导入关系与语言配置。'],['terminal','运行语言服务','仅在需要时启动对应服务进程。']],installed:true,enabled:true,runtime:'已休眠',scope:'project'},
    {id:'markdown',name:'Markdown 工具包',english:'Markdown Toolkit',icon:'book-open',category:'阅读',author:'Horizon',version:'0.2.0',summary:'源码与预览并排，支持目录导航与本地图片。',trigger:'打开 Markdown 预览时',contributions:['编辑区：Markdown 分栏预览','命令：打开预览 / 跳转标题'],permissions:[['folder-open','读取当前文档及本地图片','读取范围限定在当前项目。']],installed:false,enabled:false,runtime:'未启动',scope:'project'},
    {id:'formatter',name:'代码格式化',english:'Formatter',icon:'align-left',category:'工具',author:'Horizon',version:'0.2.0',next:'0.3.0',summary:'尊重项目配置，统一缩进与代码格式。',trigger:'执行格式化或保存文件时',contributions:['命令：格式化文档 / 选区','编辑器：可选保存时格式化'],permissions:[['file-pen-line','修改打开的文档','格式化结果进入编辑器，可撤销。'],['terminal','运行项目格式化工具','使用项目安装的格式化器。']],installed:true,enabled:false,runtime:'未启动',scope:'global'},

    {id:'git-graph',name:'Git 历史图',english:'Git Graph',icon:'git-branch',category:'Git',author:'Community Lab · 示例',version:'0.1.0',summary:'用分支图查看提交关系，快速定位需要审查的变更。',trigger:'打开提交图时',contributions:['主区域：提交关系图','命令：打开 Git 历史图'],permissions:[['git-branch','读取当前仓库历史','读取本地提交与分支，不执行提交或推送。']],installed:false,enabled:false,runtime:'未启动',scope:'project'},
  ];
  let items, selected, category, tab, query, permissionAccepted, keepData, settings;
  function reset(){
    items=structuredClone(catalog).map(p=>{
      const scope=p.scope, enabled=p.enabled;
      p.globalEnabled=scope==='global'&&enabled;
      p.overrides=scope==='project'?{[project().id]:enabled}:{};
      Object.defineProperty(p,'enabled',{get:()=>p.installed&&(Object.hasOwn(p.overrides,project().id)?p.overrides[project().id]:p.globalEnabled)});
      Object.defineProperty(p,'scope',{get:()=>Object.hasOwn(p.overrides,project().id)?'project':'global'});
      return p;
    });
    selected='language';category='全部';tab='overview';query='';permissionAccepted=false;keepData=true;settings={scope:'project',onSave:false,mode:'项目配置优先'};
  }
  function setEnabled(p,value,scope){if(scope==='global'){p.globalEnabled=value;p.overrides={};}else p.overrides[project().id]=value;}
  reset();
  const current = () => items.find(p=>p.id===selected) || items[1];
  const matches = key => key==='plugins'||key.startsWith('plugin-');
  const modalKeys = new Set(['plugin-install','plugin-installing','plugin-permissions','plugin-update-permissions','plugin-disable','plugin-uninstall']);
  const action = (id, key, label, ico='', cls='') => act('px-'+key,label,ico,cls).replace('data-act=',`data-plugin="${id}" data-act=`);
  const count = () => items.filter(p=>p.installed).length;
  function status(p){return !p.installed?'未安装':!p.enabled?'已停用':p.runtime;}
  function badge(p){return pill(status(p),p.enabled&&p.runtime==='运行中'?'good':'');}
  function permissions(p,changed=false){return p.permissions.length?'<div class="permission-list px-permissions">'+p.permissions.map(([ico,title,help])=>'<div>'+icon(ico)+'<span>'+title+'<small>'+help+'</small></span>'+pill('必需')+'</div>').join('')+(changed?'<div class="px-new-permission">'+icon('globe')+'<span>下载语言服务<small>仅访问扩展声明的下载地址。更新后新增。</small></span>'+pill('新增','active')+'</div>':'')+'</div>':note('无需额外权限','此扩展只提供声明式资源，不启动服务进程。','','palette');}
  function nav(key){const active=key==='plugin-updates'||key==='plugin-update-permissions'?'plugin-updates':key==='plugin-runtime'||key==='plugin-error'?'plugin-runtime':key==='plugin-developer'?'plugin-developer':key==='plugins'?'plugins':'plugin-installed';return '<nav class="px-nav" aria-label="插件中心分类">'+[['plugins','发现扩展','compass'],['plugin-installed','已安装 · '+count(),'package-check'],['plugin-updates','更新 · '+items.filter(p=>p.installed&&p.next).length,'download'],['plugin-runtime','运行状态','activity'],['plugin-developer','开发者','code-xml']].map(([id,label,ico])=>go(id,label,ico,active===id?'tonal':'')).join('')+'</nav>';}
  function heading(key){return '<div class="px-heading"><div><div class="px-eyebrow">HORIZON / EXTENSIONS</div><h1>插件中心</h1><p>把工作台，搭成你需要的样子。</p></div><div class="button-row">'+go('home','返回工作台','arrow-left','outline-button')+go('settings-layout','布局与外观','panels-top-left','outline-button')+act('px-install-package','安装扩展包','package-plus','tonal')+'</div></div>'+nav(key);}
  function card(p){return '<article class="plugin-card px-card" data-search="'+escape(p.name+' '+p.english+' '+p.category)+'"><div class="px-card-top"><span class="plugin-symbol">'+icon(p.icon)+'</span><div><h3>'+p.name+'</h3><small>'+p.author+' · '+p.category+'</small></div>'+badge(p)+'</div><p>'+p.summary+'</p><div class="px-trigger">'+icon('zap')+p.trigger+'</div><div class="px-card-foot"><small>v'+p.version+(p.installed?' · '+(p.scope==='global'?'全局':'项目覆盖'):'')+'</small>'+action(p.id,'detail','详情','','outline-button')+(p.installed?action(p.id,p.enabled?'disable':'enable',p.enabled?'停用':'启用','',p.enabled?'':'tonal'):action(p.id,'install','安装','plus','filled'))+'</div></article>';}
  function listing(key){const installed=key==='plugin-installed'||modalKeys.has(key),empty=key==='plugin-empty';const list=empty?[]:items.filter(p=>(!installed||p.installed)&&(category==='全部'||p.category===category));return '<div class="px-toolbar"><div class="px-search">'+icon('search')+input('搜索插件',query,'搜索名称、能力或作者','text','data-input="plugin-search"')+'</div>'+select('插件生效范围',[['all','全部作用域'],['global','全局启用'],['project','当前项目']], 'all','data-px-filter="scope"')+'</div>'+(!installed&&!empty?'<div class="px-categories">'+['全部','语言','阅读','工具','主题','Git'].map(c=>act('px-category:'+c,c,'',category===c?'tonal':'')).join('')+'</div>':'')+(empty?'<div class="px-empty"><span class="plugin-symbol">'+icon('package-open')+'</span><h2>从需要的第一个扩展开始。</h2><p>宿主管理仍可使用。重新安装文件树、编辑器、Git 或布局插件，恢复你需要的能力。</p><div class="button-row">'+go('plugins','发现扩展','compass','filled')+go('plugin-install','安装本地扩展包','package-plus','outline-button')+'</div></div>':(!installed?'<div class="px-banner"><div><span class="px-eyebrow">按需加载 / 保持轻盈</span><h2>阅读、编辑、工具，各取所需。</h2><p>安装只保留资源；需要某项能力时，再启动对应扩展。</p></div>'+go('plugin-runtime','查看运行状态','activity','outline-button')+'</div>':'<div class="px-section-heading"><h2>你的扩展 <span>'+count()+'</span></h2><p>已安装不等于正在运行。项目覆盖优先于全局默认。</p></div>')+'<div class="px-cards">'+list.map(card).join('')+'</div><p class="px-search-empty" hidden>没有匹配的扩展。试试其他名称或能力。</p>');}
  function details(){const p=current();return '<div class="px-detail-head">'+action(p.id,'back','已安装','arrow-left','px-back')+'<div class="px-detail-title"><span class="plugin-symbol">'+icon(p.icon)+'</span><div><h1>'+p.name+'</h1><p>'+p.english+' · '+p.author+' · v'+p.version+'</p></div>'+badge(p)+'</div><p class="px-summary">'+p.summary+'</p><div class="button-row">'+(p.installed?action(p.id,p.enabled?'disable':'enable',p.enabled?'停用':'启用',p.enabled?'pause':'play','tonal')+go('plugin-settings','插件设置','settings-2','outline-button')+action(p.id,'uninstall','卸载','','danger-text'):action(p.id,'install','安装扩展','download','filled'))+(p.next?action(p.id,'update','更新到 '+p.next,'download','outline-button'):'')+'</div></div><nav class="px-detail-tabs" aria-label="插件详情">'+[['overview','概览'],['permissions','权限'],['contributions','提供的能力'],['versions','版本记录']].map(([id,label])=>act('px-tab:'+id,label,'',tab===id?'tonal':'')).join('')+'<span class="spacer"></span>'+pill('horizon.'+p.id)+'</nav><div class="px-detail-body">'+(tab==='permissions'?'<h2>权限与作用域</h2>'+permissions(p)+row('当前生效范围',pill(p.scope==='global'?'全局默认':'当前项目 · '+project().short,'active')):tab==='contributions'?'<h2>扩展带来的入口</h2><div class="px-capabilities">'+p.contributions.map(c=>'<div>'+icon('puzzle')+c+'</div>').join('')+'</div>':tab==='versions'?'<h2>版本记录</h2><div class="px-version"><strong>v'+p.version+'</strong>'+pill('已安装版本','active')+'<p>改善按需启动与项目会话恢复。</p></div>'+(p.next?'<div class="px-version"><strong>v'+p.next+'</strong>'+pill('可更新')+'<p>新增项目配置支持；更新前检查权限变化。</p>'+action(p.id,'update','查看更新','arrow-up-right','tonal')+'</div>':''):'<div class="px-detail-columns"><section><h2>在需要的时候出现。</h2><p>'+p.summary+' 切换项目时保留配置，关闭面板后按生命周期策略释放可恢复的服务。</p><h3>提供的能力</h3><div class="px-capabilities">'+p.contributions.map(c=>'<div>'+icon('check')+c+'</div>').join('')+'</div><h3>使用方式</h3><p>'+p.trigger+'，无需手动启动后台服务。也可以从命令入口找到扩展提供的操作。</p></section><aside><h3>扩展信息</h3>'+row('来源',pill(p.author==='Horizon'?'内置可选':'本地扩展包'))+row('运行方式',pill(p.id==='theme-paper'?'声明式资源':'按需运行'))+row('生效范围',pill(p.scope==='global'?'全局默认':'当前项目'))+row('兼容性','<span>Horizon 0.1+</span>')+row('权限',act('px-tab:permissions',p.permissions.length+' 项','shield-check'))+'</aside></div>')+'</div>';}
  function configuration(){const p=current();return '<div class="px-detail-head">'+action(p.id,'detail','返回 '+p.name,'arrow-left','px-back')+'<h1>插件设置</h1><p>'+p.name+' · 配置只影响这个扩展</p></div><div class="px-config"><div class="settings-scope">'+select('插件设置范围',[['global','全局默认'],['project','当前项目 · '+project().short]],settings.scope,'data-px-setting="scope"')+pill(settings.scope==='project'?'项目覆盖':'所有项目','active')+'</div>'+row('启用此扩展','<label class="toggle cursor-interaction"><input type="checkbox" aria-label="启用当前插件" '+(p.enabled?'checked':'')+' data-px-setting="enabled"><span class="track"></span></label>','安装保留扩展文件；停用会停止对应服务并移除入口。')+row('配置来源',select('配置来源',['项目配置优先','使用扩展默认'],settings.mode,'data-px-setting="mode"'),'项目配置可与代码一起共享。')+row('保存时执行','<label class="toggle cursor-interaction"><input type="checkbox" aria-label="保存时执行" '+(settings.onSave?'checked':'')+' data-px-setting="onSave"><span class="track"></span></label>','仅对扩展支持的文件类型生效。')+row('启动方式',pill('按需启动'),'触发条件：'+p.trigger)+'<div class="px-config-foot">'+act('px-inherit','恢复继承全局','rotate-ccw','outline-button')+'<span>'+icon('check')+'偏好即时生效</span></div></div>';}
  function updates(){const list=items.filter(p=>p.installed&&p.next);return '<div class="px-section-heading"><h2>可用更新 <span>'+list.length+'</span></h2><p>更新前查看版本变化。新增权限需要重新确认。</p></div>'+(!list.length?'<div class="px-empty"><span class="plugin-symbol">'+icon('circle-check')+'</span><h2>所有扩展已是最新版本。</h2>'+go('plugin-installed','查看已安装','package-check','tonal')+'</div>':'<div class="px-updates">'+list.map(p=>'<article><span class="plugin-symbol">'+icon(p.icon)+'</span><div class="px-update-copy"><h3>'+p.name+'</h3><p>v'+p.version+' → v'+p.next+'</p><small>'+(p.id==='language'?'新增语言服务下载能力；修复项目切换后的诊断恢复。':'改善格式化结果，沿用当前权限。')+'</small></div>'+(p.id==='language'?pill('新增 1 项权限','active'):pill('权限未变化'))+action(p.id,'update','查看并更新','download','tonal')+'</article>').join('')+'</div>')+'<div class="px-update-policy">'+row('更新方式',select('插件更新方式',['提醒后手动更新','自动更新无新增权限的扩展'],'提醒后手动更新'),'更新失败时保留旧版本与配置；新增权限始终先确认。')+'</div>';}
  function runtime(key){const failed=key==='plugin-error';return '<div class="px-section-heading"><h2>运行状态</h2><p>查看哪个扩展在工作，按需停止或恢复。</p></div><div class="px-runtime-legend">'+pill(items.filter(p=>p.installed&&p.enabled&&p.runtime==='运行中').length+' 个运行中','good')+pill(items.filter(p=>p.installed&&p.enabled&&p.runtime==='已休眠').length+' 个休眠')+pill('主题资源无需进程')+'</div>'+(failed?note('语言增强未能启动','语言服务意外退出。重试会重新启动该服务。','error','circle-alert'):'')+'<div class="px-runtime-list">'+items.filter(p=>p.installed).map(p=>'<article><span class="plugin-symbol">'+icon(p.icon)+'</span><div class="px-runtime-copy"><strong>'+p.name+'</strong><small>'+p.trigger+'</small></div>'+pill(failed&&p.id==='language'?'启动失败':status(p),p.runtime==='运行中'?'good':'')+'<div class="px-runtime-actions">'+(failed&&p.id==='language'?action(p.id,'retry','重试','refresh-cw','tonal'):p.runtime==='运行中'?action(p.id,'stop','停止','square','outline-button'):p.enabled&&p.runtime!=='无需进程'?action(p.id,'wake','唤醒','play','outline-button'):'')+action(p.id,'detail','详情','','')+'</div></article>').join('')+'</div>'+(failed?'<section class="px-log"><div><h3>最近日志 · Language Tools</h3>'+act('px-copy-log','复制日志','copy')+'</div><pre>00:12:04  启动 TypeScript 语言服务\n00:12:05  服务已退出，退出码 1\n00:12:05  未找到项目中的 typescript 包</pre><div class="button-row">'+action('language','retry','重新启动','refresh-cw','tonal')+action('language','disable','停用此项目中的扩展','pause','outline-button')+'</div></section>':'<div class="px-runtime-note">'+icon('leaf')+'停用扩展会移除入口并结束服务；关闭面板只改变显示状态。</div>');}
  function developer(){return '<div class="px-section-heading"><h2>开发你的扩展</h2><p>加载本地目录，检查声明，再把能力接入工作台。</p></div><div class="px-dev-grid"><section><h3>加载开发目录</h3>'+field('扩展目录','<div class="input-action">'+input('扩展开发目录','~/Projects/horizon-markdown')+act('px-dev-load','加载','folder-open','tonal')+'</div>')+'<div class="px-dev-status">'+note('Markdown Toolkit · 开发模式','清单有效 · 3 个贡献点 · 文件变化后可重新加载。','','package-check')+'</div><div class="button-row">'+act('px-dev-reload','重新加载','refresh-cw','tonal')+go('plugin-runtime','运行日志','terminal','outline-button')+'</div><h3>可贡献的界面</h3><div class="px-contribution-grid">'+[['command','命令与快捷键'],['panel-left','侧栏视图'],['panel-bottom','底部面板'],['palette','主题与图标'],['file-code','编辑器能力'],['settings-2','插件设置']].map(([ico,label])=>'<span>'+icon(ico)+label+'</span>').join('')+'</div></section><section class="px-manifest"><div><h3>manifest.json</h3>'+pill('示例')+'</div><pre>{\n  "id": "local.markdown",\n  "name": "Markdown Toolkit",\n  "version": "0.1.0",\n  "engines": { "horizon": "^0.1.0" },\n  "activationEvents": [\n    "onCommand:markdown.preview"\n  ],\n  "contributes": {\n    "commands": ["markdown.preview"],\n    "panels": ["markdown.preview"]\n  },\n  "permissions": ["project.read"]\n}</pre><p>贡献点和权限在清单中声明，入口由宿主统一渲染。</p></section></div>';}
  function render(key){let content;if(key==='plugin-detail')content=details();else if(key==='plugin-settings')content=configuration();else if(key==='plugin-updates'||key==='plugin-update-permissions')content=updates();else if(key==='plugin-runtime'||key==='plugin-error')content=runtime(key);else if(key==='plugin-developer')content=developer();else content=listing(key);return '<main class="project-page px-center" aria-label="插件中心"><div class="page-content">'+heading(key)+content+'</div></main>';}
  function dialog(key){const p=current();if(key==='plugin-install')return dialogFrame('安装扩展包','<div class="px-dropzone">'+icon('package-plus')+'<strong>选择 .horizon-extension 扩展包</strong><span>也可以从已下载的文件中选择</span>'+act('px-pick-package','选择文件','folder-open','tonal')+'</div><div class="px-package-info"><span class="plugin-symbol">'+icon(p.icon)+'</span><div><strong>'+p.name+'</strong><small>horizon.'+p.id+' · v'+p.version+' · '+p.author+'</small></div>'+pill('兼容','good')+'</div>'+row('安装后启用范围',select('安装启用范围',[['project','仅当前项目'],['global','所有项目']],'project','data-px-setting="scope"'))+'<p class="small muted">下一步查看扩展需要的权限。</p>',go('plugin-installed','取消')+act('px-review-install','继续','arrow-right','filled'));if(key==='plugin-installing')return dialogFrame('正在安装 '+p.name,'<div class="px-package-info"><span class="plugin-symbol">'+icon(p.icon)+'</span><div><strong>'+p.name+'</strong><small>v'+p.version+' · '+(settings.scope==='global'?'所有项目':project().name)+'</small></div></div><ol class="px-install-steps"><li>'+icon('check')+'检查扩展包与兼容性</li><li>'+icon('check')+'确认所需权限</li><li class="current">'+icon('package-open')+'安装扩展文件</li><li class="muted">'+icon('circle')+'注册命令与界面入口</li></ol><div class="progress-track" role="progressbar" aria-label="扩展安装进度" aria-valuenow="68" aria-valuemin="0" aria-valuemax="100"><span style="width:68%"></span></div>',act('px-cancel-install','取消安装')+act('px-finish-install','演示完成','check','filled'));if(key==='plugin-permissions'||key==='plugin-update-permissions'){const changed=key==='plugin-update-permissions';return dialogFrame(changed?'更新需要新的权限':'确认扩展权限','<div class="px-package-info"><span class="plugin-symbol">'+icon(p.icon)+'</span><div><strong>'+p.name+'</strong><small>'+(changed?'v'+p.version+' → v'+p.next:'v'+p.version+' · '+p.author)+'</small></div></div>'+permissions(p,changed)+row('生效范围',pill(settings.scope==='global'?'所有项目':'当前项目 · '+project().short,'active'))+'<label class="px-consent"><input type="checkbox" data-px-consent '+(permissionAccepted?'checked':'')+'>允许上述能力在所选范围内使用</label>',go(changed?'plugin-updates':'plugin-installed',changed?'暂不更新':'取消')+'<button class="filled cursor-interaction" data-act="px-approve-'+(changed?'update':'install')+'" '+(!permissionAccepted?'disabled':'')+'>'+icon('check')+(changed?'允许并更新':'安装并启用')+'</button>');}if(key==='plugin-disable')return dialogFrame('停用 '+p.name+'？','<p class="description">相关命令和界面入口会暂时移除，已安装文件与配置保留。</p>'+field('停用范围',select('停用范围',[['project','仅当前项目'],['global','所有项目']],settings.scope,'data-px-setting="scope"'))+note('正在运行的服务会停止','再次启用后，在下一次需要时重新启动。','','pause'),go('plugin-installed','取消')+act('px-confirm-disable','停用扩展','pause','filled'));if(key==='plugin-uninstall')return dialogFrame('卸载 '+p.name+'？','<p class="description">从本机移除扩展及其界面入口。项目中的代码文件保持原位。</p><div class="px-package-info"><span class="plugin-symbol">'+icon(p.icon)+'</span><div><strong>'+p.name+'</strong><small>v'+p.version+' · '+(p.scope==='global'?'全局安装':'当前项目启用')+'</small></div></div><label class="px-consent"><input type="checkbox" data-px-keep '+(keepData?'checked':'')+'>保留扩展配置，便于以后重新安装</label>',go('plugin-installed','取消','','outline-button')+act('px-confirm-uninstall','卸载扩展','trash-2','danger-button'));return '';}
  function handle(actionName,event){if(!actionName.startsWith('px-'))return false;const id=event.target.closest('[data-plugin]')?.dataset.plugin;if(id)selected=id;const key=actionName.slice(3),p=current();
    if(key.startsWith('category:')){category=key.slice(9);paint();return true;}if(key.startsWith('tab:')){tab=key.slice(4);paint();return true;}
    switch(key){
      case 'detail':tab='overview';navigate('plugin-detail');break;
      case 'back':navigate('plugin-installed');break;
      case 'install':settings.scope='project';navigate('plugin-install');break;
      case 'install-package':selected='markdown';settings.scope='project';navigate('plugin-install');break;
      case 'pick-package':selected='markdown';paint();toast('已选择 Markdown Toolkit 扩展包（演示）');break;
      case 'review-install':permissionAccepted=false;navigate('plugin-permissions');break;
      case 'approve-install':if(permissionAccepted)navigate('plugin-installing');break;
      case 'cancel-install':navigate('plugin-installed');toast('安装已取消，未启用扩展');break;
      case 'finish-install':p.installed=true;setEnabled(p,true,settings.scope);p.runtime=p.id==='theme-paper'?'无需进程':'待激活';navigate('plugin-installed');toast(p.name+' 已安装，将按需启动（演示）');break;
      case 'enable':setEnabled(p,true,'project');p.runtime=p.id==='theme-paper'?'无需进程':'待激活';paint();toast(p.name+' 已启用（演示）');break;
      case 'disable':settings.scope=p.scope;navigate('plugin-disable');break;
      case 'confirm-disable':setEnabled(p,false,settings.scope);p.runtime='未启动';navigate('plugin-installed');toast(p.name+' 已停用，配置保留（演示）');break;
      case 'uninstall':navigate('plugin-uninstall');break;
      case 'confirm-uninstall':p.installed=false;setEnabled(p,false,'global');p.runtime='未启动';navigate('plugin-installed');toast(p.name+' 已卸载'+(keepData?'，配置保留':'，配置已清理')+'（演示）');break;
      case 'update':if(p.id==='language'){permissionAccepted=false;navigate('plugin-update-permissions');}else{p.version=p.next||p.version;p.next=null;navigate('plugin-updates');toast('扩展已更新（演示）');}break;
      case 'approve-update':if(permissionAccepted){if(p.id==='language'&&p.next)p.permissions.push(['globe','下载语言服务','仅访问扩展声明的下载地址。']);p.version=p.next||p.version;p.next=null;navigate('plugin-updates');toast(p.name+' 已更新（演示）');}break;
      case 'retry':case 'wake':setEnabled(p,true,'project');p.runtime='运行中';navigate('plugin-runtime');toast(p.name+' 已启动（演示）');break;
      case 'stop':p.runtime='已休眠';paint();toast(p.name+' 已停止，下次需要时恢复（演示）');break;
      case 'inherit':delete p.overrides[project().id];settings.scope='global';settings.onSave=false;paint();toast('已恢复继承全局配置');break;
      case 'copy-log':toast('诊断日志已复制（演示）');break;
      case 'dev-load':case 'dev-reload':toast('开发扩展已重新加载，贡献点已刷新（演示）');break;

  root.addEventListener('input',e=>{if(customization.input(e))return;const name=e.target.dataset.input;if(name==='commit'){state.commit=e.target.value;const submit=activeApp(e).querySelector('[data-act="commit"]');if(submit)submit.disabled=!e.target.value.trim()||!(state.staged||state.screen==='git-commit');}if(name==='project-search'){const q=e.target.value.toLowerCase();activeApp(e).querySelectorAll('.project-card').forEach(card=>card.hidden=!card.textContent.toLowerCase().includes(q));}if(name==='plugin-search'){pluginCenter.search(e);}if(name==='shortcut-search'){const q=e.target.value.toLowerCase();activeApp(e).querySelectorAll('.shortcut-row').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(q));}if(name==='quick-search'){state.query=e.target.value;const app=activeApp(e),value=state.query.toLowerCase();app.querySelectorAll('.quick-result').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(value)&&!value.startsWith('>'));}});
  root.addEventListener('keydown',e=>{const app=activeApp(e),modal=app?.querySelector('.overlay');if(e.key==='Tab'&&modal){const controls=[...modal.querySelectorAll('button,input,textarea,select')].filter(el=>!el.disabled&&el.getClientRects().length),first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}if(e.key==='Escape'){if(state.viewMenu){state.viewMenu=false;paint();}else if(modal&&pluginCenter.matches(state.screen))navigate(pluginCenter.closeKey());else if(modal||state.screen==='focus'||isAI(state.screen))navigate('home');}if(e.metaKey||e.ctrlKey){const key=e.key.toLowerCase();if(['k','b','j',',','s'].includes(key)){e.preventDefault();if(key==='b')doAction('sidebar',e);else if(key==='s')doAction('save',e);else navigate(({k:'quick-open',j:'ai-chat',',':'settings-appearance'})[key]);}}if(e.key==='Enter'&&e.target.matches('[data-input="quick-search"]'))navigate('home');});
  window.addEventListener('openai:set_globals',e=>{const saved=e.detail?.globals?.widgetState?.modelContent;if(saved?.design==='Horizon'&&screens.some(s=>s.key===saved.screen))navigate(saved.screen,{persist:false,focus:false});});
  window.HorizonDesign={screens,styles,state,show:(key,styleId)=>{pluginCenter.preview(key);navigate(key,{persist:false,focus:false});if(styleId){for(const {el,style}of apps)el.parentElement.hidden=style.id!==styleId;}},reset:()=>{Object.assign(state,{screen:'home',project:0,file:'workspace.ts',staged:false,commit:'',theme:'system',accent:'default',density:'comfortable',lineNumbers:true,wrap:true,sidebar:true,projectbar:true,status:true,viewMenu:false,folderOpen:true,drawerExpanded:false,cloneProgress:false,toast:''});pluginCenter.reset();customization.reset();paint();},customization,ready:true};
  paint();
  if(globalThis.Tweak){for(const {el,style} of apps){const computed=getComputedStyle(el),design={radius:parseInt(computed.getPropertyValue('--h-radius'))||style.radius,tree:parseInt(computed.getPropertyValue('--h-tree'))||218,font:13};const tweak=new Tweak({container:el,onChange:()=>{el.style.setProperty('--h-radius',design.radius+'px');el.style.setProperty('--h-tree',design.tree+'px');el.style.setProperty('--h-font',design.font+'px');}});tweak.addSlider(design,'radius',{label:'面板圆角',min:0,max:32,unit:'px'});tweak.addSlider(design,'tree',{label:'文件侧栏宽度',min:180,max:320,unit:'px'});tweak.addSlider(design,'font',{label:'代码字号',min:12,max:18,unit:'px'});}}
})();

</script>
