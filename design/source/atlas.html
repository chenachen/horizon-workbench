<div id="horizon-atlas">
  <div class="atlas-controls">
    <div class="atlas-label"><span class="atlas-wordmark">Horizon</span><span class="atlas-subtitle">界面设计图集</span></div>
    <div class="atlas-pickers"><label>场景<select class="cursor-interaction" id="horizon-group" aria-label="设计分组"></select></label><label class="atlas-page-picker">设计图<select class="cursor-interaction" id="horizon-screen" aria-label="设计页面"></select></label></div>
  </div>
  <div id="horizon-variants" class="viz-carousel" aria-label="Horizon 八套界面风格" data-previous-label="上一套风格" data-next-label="下一套风格">
    <section data-variant="雾蓝 · 分区工作台" aria-label="雾蓝风格"><div id="horizon-mist" class="hz" data-style="mist" aria-label="雾蓝工作台"></div></section>
    <section data-variant="暖纸 · 一体侧栏" aria-label="暖纸风格" hidden><div id="horizon-paper" class="hz" data-style="paper" aria-label="暖纸工作台"></div></section>
    <section data-variant="深空 · 顶部项目标签" aria-label="深空风格" hidden><div id="horizon-orbit" class="hz" data-style="orbit" aria-label="深空工作台"></div></section>
    <section data-variant="石墨 · 紧凑工具栏" aria-label="石墨风格" hidden><div id="horizon-graphite" class="hz" data-style="graphite" aria-label="石墨工作台"></div></section>
    <section data-variant="青瓷 · 可折叠导航" aria-label="青瓷风格" hidden><div id="horizon-celadon" class="hz" data-style="celadon" aria-label="青瓷工作台"></div></section>
    <section data-variant="鸢尾 · Expressive 分区" aria-label="鸢尾风格" hidden><div id="horizon-iris" class="hz" data-style="iris" aria-label="鸢尾工作台"></div></section>
    <section data-variant="砂岩 · 展开式项目目录" aria-label="砂岩风格" hidden><div id="horizon-sand" class="hz" data-style="sand" aria-label="砂岩工作台"></div></section>
    <section data-variant="极光 · 底部项目栏" aria-label="极光风格" hidden><div id="horizon-aurora" class="hz" data-style="aurora" aria-label="极光工作台"></div></section>
  </div>
  <div class="atlas-caption" aria-live="polite"><div><span id="horizon-screen-id"></span><strong id="horizon-screen-title"></strong></div><p id="horizon-screen-note"></p></div>
  <details class="atlas-directory"><summary class="cursor-interaction">全部设计图目录</summary><div id="horizon-directory"></div></details>
</div>
