<script>
(()=>{
  const root=document.getElementById('feather-material');

  const button=(action,label,ico,cls='')=>'<button type="button" class="cursor-interaction '+cls+'" data-action="'+action+'">'+(ico?icon(ico):'')+label+'</button>';
  const palettes={violet:['#68528e','#d1bcf5','#eaddff','#4f3c6d','#322047','#eadcff'],sage:['#426654','#abd2b8','#d4e9da','#2e4f3c','#173726','#cce9d4'],blue:['#435e91','#b3c8ff','#dbe4ff','#2a416d','#1b2e53','#dce6ff']};
  const code={
    'workspace.ts':{folder:'src',lang:'TypeScript',type:'TS',text:'import { createStore } from "./store";\nimport type { Project } from "./types";\n\nexport const workspace = createStore({\n  activeProject: "aurora",\n  projects: new Map<string, Project>(),\n});\n\nexport async function switchProject(id: string) {\n  const current = workspace.activeProject;\n\n  // 留住每个项目的阅读位置与界面状态\n  await saveSession(current);\n  const session = await restoreSession(id);\n\n  workspace.set({ activeProject: id });\n  editor.restore(session.tabs);\n  panels.restore(session.layout);\n}\n\n// 项目之间，切换自如。',diff:[[' ','export async function switchProject(id: string) {'],[' ','  const current = workspace.activeProject;'],['-','  editor.closeAll();'],['+','  await saveSession(current);'],['+','  const session = await restoreSession(id);'],[' ',''],[' ','  workspace.set({ activeProject: id });'],['+','  editor.restore(session.tabs);'],['+','  panels.restore(session.layout);'],[' ','}']]},
    'theme.css':{folder:'src',lang:'CSS',type:'#',text:':root {\n  --color-primary: #68528e;\n  --surface-radius: 16px;\n  --sidebar-width: 212px;\n  --row-height: 34px;\n}\n\n.workspace {\n  display: flex;\n  min-height: 100%;\n}\n\n.editor {\n  flex: 1;\n  border-radius: var(--surface-radius);\n}\n\n/* 主题令牌独立于功能插件。 */',diff:[[' ','.editor {'],[' ','  flex: 1;'],['-','  border-radius: 4px;'],['+','  border-radius: var(--surface-radius);'],[' ','}']]},
    'index.ts':{folder:'src',lang:'TypeScript',type:'TS',text:'import { workspace } from "./workspace";\nimport { loadTheme } from "./theme";\n\nasync function bootstrap() {\n  await loadTheme();\n  await workspace.restore();\n}\n\nbootstrap();',diff:[]},
    'button.ts':{folder:'src',lang:'TypeScript',type:'TS',text:'export type ButtonVariant =\n  | "filled"\n  | "tonal"\n  | "text";\n\nexport const buttonTokens = {\n  height: 40,\n  radius: 20,\n  horizontalPadding: 24,\n};\n\nexport function createButton(variant: ButtonVariant) {\n  const button = document.createElement("button");\n  button.dataset.variant = variant;\n  return button;\n}',diff:[]},
    'README.md':{folder:'',lang:'Markdown',type:'M↓',text:'# Feather\n\n留一点空间，专注重要的事。\n\n## 工作区\n\n一个工作区，可以容纳多个独立项目。\n每个项目保留文件、Git 与 AI 上下文。\n\n## 按需展开\n\n- 文件与 Git 共享左侧区域\n- AI 在右侧打开\n- 终端从底部展开\n- 配置统一进入设置',diff:[]},
    'package.json':{folder:'',lang:'JSON',type:'{}',text:'{\n  "name": "feather-workspace",\n  "private": true,\n  "scripts": {\n    "dev": "vite",\n    "build": "vite build"\n  }\n}',diff:[]}
  };
  const projectSeeds=[
    {id:'aurora',name:'Aurora Web',short:'Aurora',symbol:'A',folder:'aurora-web',workspace:'personal',files:['workspace.ts','theme.css','index.ts','package.json','README.md'],changed:['workspace.ts','theme.css']},
    {id:'kit',name:'UI Kit',short:'UI Kit',symbol:'K',folder:'ui-kit',workspace:'personal',files:['button.ts','theme.css','package.json','README.md'],changed:[]},
    {id:'docs',name:'Feather Docs',short:'Docs',symbol:'D',folder:'feather-docs',workspace:'personal',files:['README.md','package.json'],changed:[]},
    {id:'atlas',name:'Atlas Store',short:'Atlas',symbol:'A',folder:'atlas-store',workspace:'client',files:['index.ts','theme.css','package.json','README.md'],changed:[]},
    {id:'billing',name:'Billing API',short:'Billing',symbol:'B',folder:'billing-api',workspace:'client',files:['index.ts','package.json','README.md'],changed:[]}
  ];
  const sections=[['appearance','palette','外观'],['layout','panels-top-left','布局与面板'],['editor','code','编辑器'],['projects','folders','工作区与项目'],['ai','sparkles','AI 接入'],['plugins','blocks','插件'],['shortcuts','keyboard','快捷键'],['git','git-branch','Git']];
  const models={};
  const controllers={};
  const defaults=()=>({theme:'system',accent:'violet',density:'comfortable',font:13,projectbar:true,status:true,restore:true,sleep:true,terminalPlugin:false,languagePlugin:false,formatPlugin:false,lineNumbers:true,wrap:true,platform:'mac',provider:'agent',gitRefresh:true});
  function fresh(layout){return{layout,workspace:'personal',active:'aurora',workspaceActive:{personal:'aurora',client:'atlas'},projects:JSON.parse(JSON.stringify(projectSeeds)),sessions:{},settings:defaults()};}
  function highlighting(line){const re=/(\/\/.*$|"[^"\n]*"|'[^'\n]*'|\b(?:import|from|type|export|const|new|async|function|await|return|string)\b|\b\d+\b)/g;let out='',last=0;for(const m of line.matchAll(re)){out+=esc(line.slice(last,m.index));const t=m[0],cls=t.startsWith('//')?'comment':/^['"]/.test(t)?'string':/^\d/.test(t)?'number':'keyword';out+='<span class="'+cls+'">'+esc(t)+'</span>';last=m.index+t.length;}return out+esc(line.slice(last));}
  function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
  const saved=window.openai?.widgetState;
  function readSaved(s){return s?.privateContent?.version===2?s.privateContent.models:null;}
  function persist(){window.openai?.setWidgetState?.({modelContent:{design:'Feather Material 3',layouts:Object.fromEntries(Object.entries(models).map(([id,s])=>[id,{layout:s.layout,workspace:s.workspace,project:s.active,theme:s.settings.theme,density:s.settings.density,accent:s.settings.accent}]))},privateContent:{version:2,models}})?.catch(()=>{});}
  for(const [id,layout] of [['fm-rail','rail']]){
    const app=document.getElementById(id);app.appendChild(template.content.cloneNode(true));
    app.querySelector('.sidebar-title').insertAdjacentHTML('beforeend','<button class="icon-btn mobile-close cursor-interaction" data-action="sidebar" aria-label="关闭文件侧栏">'+icon('x')+'</button>');
    let state=Object.assign(fresh(layout),readSaved(saved)?.[id]||{});state.settings={...defaults(),...state.settings};models[id]=state;
    let dialog='',section='appearance',menu=false,focus=false,toastTimer,returnFocus=null,folderOpen=true;
    const $=sel=>app.querySelector(sel), $$=sel=>[...app.querySelectorAll(sel)];
    const project=()=>state.projects.find(p=>p.id===state.active)||state.projects[0];
    const session=()=>state.sessions[state.active]||(state.sessions[state.active]={file:project().files[0],tabs:project().id==='aurora'?['workspace.ts','theme.css']:[project().files[0]],sidebar:!matchMedia('(max-width:640px)').matches,mode:'files',ai:false,terminal:false,staged:[],committed:[],branch:'main',message:'',answer:''});
    const changed=()=>project().changed.filter(f=>!session().committed.includes(f));
    const key=()=>state.settings.platform==='mac'?'⌘':'Ctrl';
    const toast=msg=>{clearTimeout(toastTimer);$('.snackbar').textContent=msg;$('.snackbar').hidden=false;toastTimer=setTimeout(()=>$('.snackbar').hidden=true,2800);};
    const toggle=(name,value,label,kind='pref')=>'<label class="toggle cursor-interaction"><input type="checkbox" data-'+kind+'="'+name+'" '+(value?'checked':'')+' aria-label="'+label+'"><span class="track"></span></label>';
    const row=(title,control,desc='')=>'<div class="setting-row"><div class="setting-copy">'+title+(desc?'<small>'+desc+'</small>':'')+'</div>'+control+'</div>';
    const select=(name,options,value)=>'<select class="cursor-interaction" aria-label="'+name+'" data-pref="'+name+'">'+options.map(([v,l])=>'<option value="'+v+'" '+(String(value)===v?'selected':'')+'>'+l+'</option>').join('')+'</select>';
    function appearance(){const s=state.settings;app.dataset.layout=state.layout;app.dataset.sidebar=session().sidebar;app.dataset.projectbar=s.projectbar;app.dataset.status=s.status;app.dataset.focus=focus;app.style.colorScheme=s.theme==='system'?'light dark':s.theme;app.style.setProperty('--f-row',s.density==='compact'?'28px':'34px');app.style.setProperty('--f-font',s.font+'px');const c=palettes[s.accent]||palettes.violet;app.style.setProperty('--f-accent','light-dark('+c[0]+','+c[1]+')');app.style.setProperty('--f-tonal','light-dark('+c[2]+','+c[3]+')');app.style.setProperty('--f-on-tonal','light-dark('+c[4]+','+c[5]+')');}
    function renderProjects(){const ps=state.projects.filter(p=>p.workspace===state.workspace);$('.workspace-label').textContent=state.workspace==='personal'?'个人工作区':'客户工作区';$('.project-rail').innerHTML=button('projects',icon('layout-grid'),'','icon-btn')+'<div class="rail-divider"></div>'+ps.map(p=>'<button class="rail-project cursor-interaction '+(p.id===state.active?'active':'')+'" data-project="'+p.id+'" aria-label="切换到 '+esc(p.name)+'" aria-pressed="'+(p.id===state.active)+'" data-tooltip="'+esc(p.name)+'"><span class="project-symbol">'+esc(p.symbol)+'</span><span>'+esc(p.short)+'</span></button>').join('')+button('add-project',icon('plus'),'','icon-btn')+'<div class="rail-bottom">'+button('command',icon('search'),'','icon-btn')+'</div>';$('.project-rail [data-action="projects"]').setAttribute('aria-label','所有项目');$('.project-rail [data-action="add-project"]').setAttribute('aria-label','添加项目');$('.project-rail [data-action="command"]').setAttribute('aria-label','搜索文件或命令');$('.project-tabs').innerHTML=button('projects',icon('layout-grid'),'','icon-btn')+ps.map(p=>'<button class="project-tab cursor-interaction '+(p.id===state.active?'active':'')+'" data-project="'+p.id+'" aria-pressed="'+(p.id===state.active)+'"><span class="mini-mark">'+esc(p.symbol)+'</span>'+esc(p.name)+'</button>').join('')+button('add-project',icon('plus'),'','icon-btn');$('.project-tabs [data-action="projects"]').setAttribute('aria-label','所有项目');$('.project-tabs [data-action="add-project"]').setAttribute('aria-label','添加项目');}
    function fileRow(f,indent=true){return '<button class="cursor-interaction '+(indent?'indent ':'')+(session().file===f?'active':'')+'" data-file="'+esc(f)+'"><span class="file-type">'+esc(code[f].type)+'</span><span class="file-name">'+esc(f)+'</span>'+(changed().includes(f)?'<span class="file-mark">M</span>':'')+'</button>';}
    function renderSidebar(){const p=project(),s=session();$('.project-name').textContent=p.name;$('.project-folder').textContent=p.folder;$$('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===s.mode);b.setAttribute('aria-pressed',b.dataset.mode===s.mode);});$('.count').textContent=changed().length;if(s.mode==='files'){const source=p.files.filter(f=>code[f].folder);$('.sidebar-content').innerHTML='<div class="tree">'+(source.length?'<button class="cursor-interaction" data-action="folder" aria-expanded="'+folderOpen+'">'+icon(folderOpen?'chevron-down':'chevron-right')+icon('folder-open')+'src</button>':'')+(folderOpen?source.map(f=>fileRow(f)).join(''):'')+p.files.filter(f=>!code[f].folder).map(f=>fileRow(f,false)).join('')+'</div>';}else{const pending=changed().filter(f=>!s.staged.includes(f)),staged=changed().filter(f=>s.staged.includes(f));const group=(title,fs,isStaged)=>'<div class="tree-heading"><span>'+title+' · '+fs.length+'</span>'+(fs.length?'<button class="cursor-interaction" data-action="'+(isStaged?'unstage-all':'stage-all')+'" aria-label="'+(isStaged?'全部取消暂存':'全部暂存')+'">'+icon(isStaged?'minus':'plus')+'</button>':'')+'</div>'+fs.map(f=>'<div class="git-entry">'+fileRow(f,false)+'<button class="cursor-interaction stage-button" data-stage="'+esc(f)+'" aria-label="'+(isStaged?'取消暂存 ':'暂存 ')+esc(f)+'">'+icon(isStaged?'minus':'plus')+'</button></div>').join('');$('.sidebar-content').innerHTML='<div class="tree">'+group('更改',pending,false)+group('已暂存',staged,true)+'</div>'+(changed().length?'<div class="commit-form"><textarea aria-label="提交信息" placeholder="写下这次改动…">'+esc(s.message)+'</textarea><button class="filled cursor-interaction" data-action="commit" '+(!staged.length?'disabled':'')+'>'+icon('check')+'提交'+(staged.length?' · '+staged.length:'')+'</button></div>':'<div class="empty" style="min-height:170px">'+icon('circle-check')+'工作区干净</div>');}}
    function renderEditor(){const s=session();$('.file-tabs').innerHTML=s.tabs.map(f=>'<div class="file-tab '+(s.file===f?'active':'')+'"><button class="cursor-interaction" data-file="'+esc(f)+'"><span class="file-type">'+esc(code[f].type)+'</span>'+esc(f)+'</button><button class="tab-close cursor-interaction" data-close-file="'+esc(f)+'" aria-label="关闭 '+esc(f)+'">'+(changed().includes(f)?'<span class="dirty">●</span>':'×')+'</button></div>').join('');if(!s.file){$('.editor-content').innerHTML='<div class="empty">'+icon('files')+'<span>打开文件，接着往下看。</span>'+button('command','查找文件','search','tonal')+'</div>';return;}const f=code[s.file],diff=s.mode==='git'&&changed().includes(s.file)&&f.diff.length;$('.editor-content').innerHTML=(diff?'<div class="diff-meta"><span>'+esc(s.file)+'</span><span class="plus">+'+f.diff.filter(x=>x[0]==='+').length+'</span><span class="minus">−'+f.diff.filter(x=>x[0]==='-').length+'</span><span class="spacer"></span><button class="cursor-interaction tonal" data-stage="'+esc(s.file)+'">'+icon(s.staged.includes(s.file)?'minus':'plus')+(s.staged.includes(s.file)?'取消暂存':'暂存文件')+'</button></div>':'<div class="crumb"><span>'+esc(project().folder)+'</span>'+icon('chevron-right')+(f.folder?'<span>'+esc(f.folder)+'</span>'+icon('chevron-right'):'')+'<span>'+esc(s.file)+'</span></div>')+'<div class="code" aria-label="'+(diff?'差异':'代码')+' '+esc(s.file)+'">'+(diff?f.diff:f.text.split('\n').map(t=>[' ',t])).map(([kind,text],i)=>'<div class="code-line '+(kind==='+'?'add':kind==='-'?'remove':'')+'" '+(!state.settings.lineNumbers?'style="grid-template-columns:18px minmax(0,1fr)"':'')+'><span class="ln">'+(state.settings.lineNumbers?(kind===' '?'':kind)+(i+1):'')+'</span><span class="source" '+(!state.settings.wrap?'style="white-space:pre;overflow:auto"':'')+'>'+highlighting(text)+'</span></div>').join('')+'</div>';$('.file-language').textContent=f.lang;$('.editor-content').style.flex='1';}

    function action(a){if(a==='settings')openDialog('settings');else if(a==='ai-settings')openDialog('settings','ai');else if(['projects','workspaces','add-project','command','branch'].includes(a))openDialog(a);else if(a==='close-dialog')closeDialog();else if(a==='view'){menu=!menu;renderMenu();}else if(a==='sidebar'||a==='ai'||a==='terminal'){focus=false;session()[a]=!session()[a];if(a==='terminal'&&session().terminal)state.settings.terminalPlugin=true;render();renderMenu();persist();}else if(a==='projectbar'||a==='status'){state.settings[a]=!state.settings[a];render();renderMenu();persist();}else if(a==='focus'){focus=!focus;menu=false;$('.menu').hidden=true;render();}else if(a==='reset-layout'){session().sidebar=!matchMedia('(max-width:640px)').matches;session().ai=false;session().terminal=false;state.settings.projectbar=true;state.settings.status=true;focus=false;menu=false;$('.menu').hidden=true;render();persist();toast('已恢复默认布局');}else if(a==='folder'){folderOpen=!folderOpen;renderSidebar();icons();}else if(a==='stage-all'||a==='unstage-all'){session().staged=a==='stage-all'?[...changed()]:[];render();persist();}else if(a==='commit'){const s=session(),input=$('.commit-form textarea');s.message=input?.value||'';if(!s.message.trim()){toast('先写一条提交信息');input?.focus();return;}const count=s.staged.length;s.committed.push(...s.staged);s.staged=[];s.message='';render();persist();toast('已提交 '+count+' 个文件（演示）');}else if(a==='create-project'){const name=$('[data-input="project-name"]').value.trim(),path=$('[data-input="project-path"]').value.trim();if(!name){const e=$('[data-project-error]');e.textContent='请输入项目名称';e.hidden=false;return;}const pid='project-'+Date.now();state.projects.push({id:pid,name,short:name.slice(0,8),symbol:name.charAt(0).toUpperCase(),folder:path.split('/').filter(Boolean).pop()||name.toLowerCase().replace(/\s+/g,'-'),workspace:state.workspace,files:['README.md','package.json'],changed:[]});changeProject(pid);toast('已添加示例项目');}else if(a==='git-pull'||a==='git-push'){toast(a==='git-pull'?'已拉取远端更新（演示）':'已推送当前分支（演示）');}else if(a.startsWith('ai-'))ask(a.slice(3));else if(a==='test-ai')toast('连接测试为演示；实际接入时在此验证');}
    app.addEventListener('click',event=>{const b=event.target.closest('button');if(!b){if(event.target===$('.overlay'))closeDialog();return;}if(b.dataset.project){changeProject(b.dataset.project);return;}if(b.dataset.workspace){state.workspace=b.dataset.workspace;state.active=state.workspaceActive[state.workspace]||state.projects.find(p=>p.workspace===state.workspace).id;closeDialog();render();persist();return;}if(b.dataset.file){const f=b.dataset.file,s=session();if(!s.tabs.includes(f))s.tabs.push(f);s.file=f;if(dialog)closeDialog();if(matchMedia('(max-width:640px)').matches)s.sidebar=false;render();persist();return;}if(b.dataset.closeFile){const s=session(),f=b.dataset.closeFile,index=s.tabs.indexOf(f);s.tabs=s.tabs.filter(t=>t!==f);if(s.file===f)s.file=s.tabs[Math.max(0,index-1)]||null;render();persist();return;}if(b.dataset.mode){session().mode=b.dataset.mode;if(b.dataset.mode==='git'&&changed().length){session().file=changed()[0];if(!session().tabs.includes(session().file))session().tabs.push(session().file);}render();persist();return;}if(b.dataset.stage){const s=session(),f=b.dataset.stage;s.staged=s.staged.includes(f)?s.staged.filter(x=>x!==f):[...s.staged,f];render();persist();toast(s.staged.includes(f)?'已暂存（演示）':'已取消暂存（演示）');return;}if(b.dataset.section){section=b.dataset.section;renderDialog();return;}if(b.dataset.color){state.settings.accent=b.dataset.color;appearance();renderDialog();persist();return;}if(b.dataset.branch){session().branch=b.dataset.branch;closeDialog();render();persist();toast('已切换分支（演示）');return;}if(b.dataset.command){const a=b.dataset.command;closeDialog();action(a);return;}if(b.dataset.action)action(b.dataset.action);});
    app.addEventListener('change',event=>{const el=event.target;if(el.dataset.pref){const k=el.dataset.pref;state.settings[k]=el.type==='checkbox'?el.checked:k==='font'?Number(el.value):el.value;if(k==='terminalPlugin'&&!el.checked)session().terminal=false;render();if(dialog)renderDialog();persist();}else if(el.dataset.panel){session()[el.dataset.panel]=el.checked;if(el.dataset.panel==='terminal'&&el.checked)state.settings.terminalPlugin=true;render();persist();}});
    app.addEventListener('input',event=>{if(event.target.matches('.command-search'))renderCommands(event.target.value);if(event.target.matches('.commit-form textarea'))session().message=event.target.value;});
    app.addEventListener('keydown',event=>{if(dialog&&event.key==='Tab'){const controls=[...$('.overlay').querySelectorAll('button,input,select,textarea')].filter(e=>!e.disabled&&e.getClientRects().length);const first=controls[0],last=controls.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}if(event.key==='Escape'){if(dialog)closeDialog();else if(menu){menu=false;renderMenu();}else if(focus){focus=false;render();}else if(session().ai){session().ai=false;render();persist();}}if((event.metaKey||event.ctrlKey)&&['k','b','j',','].includes(event.key.toLowerCase())){event.preventDefault();const a=({k:'command',b:'sidebar',j:'ai',',':'settings'})[event.key.toLowerCase()];if(dialog)closeDialog();action(a);}});
    app.addEventListener('pointerdown',event=>{if(menu&&!event.target.closest('.menu')&&!event.target.closest('[data-action="view"]')){menu=false;renderMenu();}});
    render();controllers[id]={restore(next){state=Object.assign(fresh(layout),next);state.settings={...defaults(),...state.settings};models[id]=state;render();if(dialog)renderDialog();}};
    if(globalThis.Tweak){const design={treeWidth:212,radius:16};const tweak=new Tweak({container:app,onChange:()=>{app.style.setProperty('--f-tree',design.treeWidth+'px');app.style.setProperty('--f-radius',design.radius+'px');}});tweak.addSlider(design,'treeWidth',{label:'文件侧栏宽度',min:176,max:260,step:4,unit:'px'});tweak.addSlider(design,'radius',{label:'内容区圆角',min:8,max:24,step:2,unit:'px'});}
  }
  window.addEventListener('openai:set_globals',event=>{const next=readSaved(event.detail?.globals?.widgetState);if(next)for(const [id,s]of Object.entries(next))controllers[id]?.restore(s);});
})();
</script>
<style>
#feather-material .feature-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 96px 14px 0;min-height:50px}
#feather-material .feature-label{font-weight:500;color:var(--foreground)}
#feather-material .feature-layer{position:absolute;inset:0;z-index:10;pointer-events:none;--note:light-dark(#a54526,#ffc3aa);--on-note:light-dark(#ffffff,#4b1c08)}
#feather-material .feature-pin{position:absolute;display:grid;place-items:center;width:23px;height:23px;min-height:0;border-radius:50%;background:var(--note);color:var(--on-note);font:500 11px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 0 0 2px var(--f-surface);pointer-events:none}
#feather-material .feature-pin.chosen{background:var(--f-ink);color:var(--f-surface)}
#feather-material .feature-ring{position:absolute;border:2px dashed var(--note);border-radius:9px;background:transparent;pointer-events:none}
#feather-material .feature-info{display:flex;gap:10px;align-items:baseline;margin:16px 0 6px;color:var(--foreground)}
#feather-material .feature-info .feature-info-label{font-weight:500;flex-shrink:0}
#feather-material .feature-info .feature-info-detail{color:var(--muted-foreground)}
#feather-material .feature-list{list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 24px}
#feather-material .feature-list li{min-width:0;border-bottom:1px solid var(--border);padding:10px 0 13px}
#feather-material .feature-list .feature-caption{margin:6px 0 0;color:var(--muted-foreground)}
#feather-material .feature-list .feature-key{font-variant-numeric:tabular-nums;color:light-dark(#a54526,#ffc3aa)}
#feather-material .feature-footer{margin-top:14px;color:var(--muted-foreground)}
#feather-material .feature-active-label{min-width:0;overflow-wrap:anywhere}
#feather-material .feature-toolbar[hidden],#feather-material .feature-list[hidden],#feather-material .feature-info[hidden],#feather-material .feature-footer[hidden]{display:none}
@media(max-width:750px){#feather-material .feature-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 20px}#feather-material .feature-info{align-items:flex-start;flex-direction:column;gap:4px}}
@media(max-width:440px){#feather-material .feature-toolbar{padding-right:0;flex-wrap:wrap;justify-content:flex-start}#feather-material .feature-list{grid-template-columns:minmax(0,1fr)}#feather-material .feature-pin{width:20px;height:20px;font-size:11px}}
</style>
<script>
(()=>{
  const root=document.getElementById('feather-material');
  const app=document.getElementById('fm-rail');
  const items=[
    {n:1,title:'工作区切换',selector:'.workspace-btn',desc:'切换个人、客户等工作区；每个工作区包含多个项目，并记住上次激活的项目。'},
    {n:2,title:'多项目导航',selector:'.project-rail',anchor:'.project-rail [data-action="projects"]',desc:'网格入口管理全部项目；A / K / D 切换项目；＋添加项目。各项目分别保留标签与面板状态。'},
    {n:3,title:'文件 / Git 切换',selector:'.segmented',desc:'同一侧栏切换文件树与 Git 更改，避免同时占用两块区域；Git 数字表示更改文件数。'},
    {n:4,title:'文件树 / 更改列表',selector:'.sidebar-content',anchor:'.sidebar-content .tree',desc:'文件模式展开目录、打开文件，M 表示已修改；Git 模式查看差异、暂存、取消暂存和提交。'},
    {n:5,title:'文件标签',selector:'.file-tabs',anchor:'.file-tab.active',desc:'切换和关闭已打开文件；项目切换后恢复各自标签。当前原型用圆点提示有 Git 改动的文件。'},
    {n:6,title:'代码阅读 / 差异区',selector:'.editor-content',place:'inside-right',desc:'显示路径、语法高亮、行号与代码；选择 Git 更改文件后显示行内差异。此原型暂不支持输入编辑。'},
    {n:7,title:'搜索与命令',selector:'.appbar [data-action="command"]',fallback:'.rail-bottom [data-action="command"]',desc:'搜索当前项目文件，执行面板切换、专注模式等命令；快捷键为 ⌘ K / Ctrl K。'},
    {n:8,title:'视图与面板开关',selector:'.appbar [data-action="view"]',desc:'显示或隐藏文件侧栏、AI、终端、项目导航和状态栏，也可恢复默认布局。终端默认隐藏，从这里展开。'},
    {n:9,title:'AI 助手',selector:'.appbar [data-action="ai"]',desc:'按需打开右侧对话，解释文件或审查改动；上下文和对话按项目保留。连接方式在设置中配置。'},
    {n:10,title:'统一设置',selector:'.appbar [data-action="settings"]',desc:'集中配置外观、布局、编辑器、工作区、AI、插件、快捷键和 Git。面板状态按项目保存，主题等偏好全局生效。'},
    {n:11,title:'收起文件侧栏',selector:'.editor-top [data-action="sidebar"]',desc:'只切换文件 / Git 侧栏，保留项目导航与代码；快捷键为 ⌘ B / Ctrl B。'},
    {n:12,title:'专注模式',selector:'.editor-top [data-action="focus"]',desc:'暂时隐藏项目导航、侧栏、AI、终端与状态栏。按 Esc 或点“退出专注”，恢复之前布局。'},
    {n:13,title:'分支与同步',selector:'.statusbar [data-action="branch"]',desc:'查看当前分支，打开分支切换、拉取和推送操作。旁边显示当前项目的更改数量。'},
    {n:14,title:'文件状态信息',selector:'.status-right',desc:'显示当前文件语言、编码与原型标识；整个状态栏可以在视图菜单或设置中隐藏。'}
  ];
  const bar=document.createElement('div');bar.className='feature-toolbar';
  bar.innerHTML='<span class="feature-label">项目侧栏 · 功能标注</span><button class="btn btn-ghost" type="button" aria-pressed="true" data-note-toggle>隐藏标注</button>';
  app.before(bar);
  const layer=document.createElement('div');layer.className='feature-layer';layer.setAttribute('aria-hidden','true');app.append(layer);
  const ring=document.createElement('div');ring.className='feature-ring';ring.hidden=true;layer.append(ring);
  const info=document.createElement('div');info.className='feature-info text-small';info.setAttribute('aria-live','polite');
  info.innerHTML='<span class="feature-info-label">功能索引</span><span class="feature-info-detail">选择下方条目，可定位对应区域。</span>';
  const list=document.createElement('ol');list.className='feature-list';list.setAttribute('aria-label','功能说明');
  const footer=document.createElement('div');footer.className='feature-footer text-small';footer.textContent='标注属于设计说明。Git、AI、终端使用演示数据；隐藏标注后可继续操作原型。';
  app.after(info,list,footer);
  let enabled=true,selected=null,pending=false;
  const pins=new Map(),entries=new Map();
  for(const item of items){
    const pin=document.createElement('span');pin.className='feature-pin';pin.textContent=item.n;pin.hidden=true;layer.append(pin);pins.set(item.n,pin);
    const li=document.createElement('li');
    const button=document.createElement('button');button.className='btn btn-ghost';button.type='button';button.setAttribute('aria-pressed','false');button.innerHTML='<span class="feature-key">'+String(item.n).padStart(2,'0')+'</span><span class="feature-active-label">'+item.title+'</span>';button.dataset.feature=item.n;
    const caption=document.createElement('p');caption.className='feature-caption text-small';caption.textContent=item.desc;
    li.append(button,caption);list.append(li);entries.set(item.n,button);
    button.addEventListener('click',()=>{selected=selected===item.n?null:item.n;update();});
  }
  function visible(el){if(!el||!el.getClientRects().length)return false;const css=getComputedStyle(el);return css.visibility!=='hidden'&&css.display!=='none';}
  function target(item){const primary=app.querySelector(item.selector);return visible(primary)?primary:item.fallback?app.querySelector(item.fallback):null;}
  function update(){
    pending=false;
    const rect=app.getBoundingClientRect(),dialog=app.querySelector('.overlay');
    const modal=dialog&&!dialog.hidden;
    layer.hidden=!enabled||modal;
    const occupied=[];
    for(const item of items){
      const el=target(item),pin=pins.get(item.n);entries.get(item.n).setAttribute('aria-pressed',selected===item.n);
      if(!enabled||modal||!visible(el)){pin.hidden=true;continue;}
      const anchor=item.anchor?app.querySelector(item.anchor):el;
      if(!visible(anchor)){pin.hidden=true;continue;}
      const b=anchor.getBoundingClientRect(),r=el.getBoundingClientRect(),size=rect.width<=440?20:23;
      if(b.bottom<=rect.top||b.top>=rect.bottom){pin.hidden=true;continue;}
      let x=b.right-rect.left-size/2-2,y=b.top-rect.top-size/2-2;
      if(item.n===2){x=b.right-rect.left+2;y=b.top-rect.top+3;}
      if(item.n===6){x=r.right-rect.left-size-12;y=r.top-rect.top+19;}
      if(item.n===5){x=b.left-rect.left+25;}
      if(item.n===11){x=b.left-rect.left-4;}
      if(item.n===14){x=b.right-rect.left-size-3;y=b.top-rect.top-size-6;}
      x=Math.max(4,Math.min(rect.width-size-4,x));y=Math.max(4,Math.min(rect.height-size-4,y));
      for(const placed of occupied){if(Math.abs(x-placed.x)<size+2&&Math.abs(y-placed.y)<size+2)y=Math.min(rect.height-size-4,placed.y+size+4);}
      occupied.push({x,y});pin.style.left=x+'px';pin.style.top=y+'px';pin.hidden=false;pin.classList.toggle('chosen',selected===item.n);
    }
    const chosen=items.find(i=>i.n===selected),el=chosen?target(chosen):null;
    ring.hidden=!enabled||modal||!visible(el);
    if(chosen){info.querySelector('.feature-info-label').textContent=String(chosen.n).padStart(2,'0')+' · '+chosen.title;info.querySelector('.feature-info-detail').textContent=modal?'当前弹窗已打开，主界面标注暂时收起。':!visible(el)?'该区域当前已隐藏，可从视图菜单恢复。':'对应区域已用虚线标出。';}
    else{info.querySelector('.feature-info-label').textContent='功能索引';info.querySelector('.feature-info-detail').textContent=modal?'当前弹窗已打开，主界面标注暂时收起。':'选择下方条目，可定位对应区域。';}
    if(!ring.hidden){const r=el.getBoundingClientRect();ring.style.left=Math.max(2,r.left-rect.left-2)+'px';ring.style.top=Math.max(2,r.top-rect.top-2)+'px';ring.style.width=Math.min(rect.width-4,r.width+4)+'px';ring.style.height=Math.min(rect.height-4,r.height+4)+'px';}
  }
  function schedule(){if(pending)return;pending=true;requestAnimationFrame(update);}
  bar.querySelector('[data-note-toggle]').addEventListener('click',event=>{enabled=!enabled;event.currentTarget.textContent=enabled?'隐藏标注':'显示功能标注';event.currentTarget.setAttribute('aria-pressed',enabled);list.hidden=!enabled;info.hidden=!enabled;footer.hidden=!enabled;update();});
  new ResizeObserver(schedule).observe(app);
  const observer=new MutationObserver(schedule);
  observer.observe(app.querySelector('.app-content'),{subtree:true,childList:true,attributes:true,attributeFilter:['hidden','class','style','inert']});
  observer.observe(app.querySelector('.overlay'),{attributes:true,attributeFilter:['hidden']});
  app.addEventListener('click',schedule);app.addEventListener('change',schedule);app.addEventListener('scroll',schedule,true);
  window.addEventListener('resize',schedule);
  update();
})();
</script>
