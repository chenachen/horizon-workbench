<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Horizon · 八套界面方向</title><style>*{box-sizing:border-box}body{margin:0;font:15px/1.6 -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;color:#253549;background:#f5f7fa}h1,h2,p{margin:0}h1{font-size:40px;font-weight:500;letter-spacing:-1px}h2{font-size:21px;font-weight:500}a{color:#496793;text-decoration:none}header{padding:42px 56px 28px}header p{color:#65738a;margin-top:8px}img{display:block;width:100%;height:auto}figure{margin:0}figcaption{padding:14px 0 8px;color:#65738a;font-size:13px}small{color:#65738a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px 28px}.cell{min-width:0}footer{font-size:12px;color:#65738a;padding:24px 56px}.tag{display:inline-block;border:1px solid #d7e0eb;padding:3px 9px;border-radius:20px;font-size:12px;color:#65738a;margin-left:10px}body{background:#f5f7fa}.overview{padding:0 56px 20px}.cell h2{margin:0 0 12px}.cell img{border-radius:12px;border:1px solid #e0e6ed}</style><body><header><small>HORIZON / DESIGN EXPLORATIONS / 0.1</small><h1>地平线，八种打开方式。</h1><p>同一组功能，八种导航与视觉节奏。每套覆盖 73 个页面与状态。</p></header><main class="overview grid"><section class="cell"><h2>雾蓝<span class="tag">分区工作台</span></h2><img src="png/mist/B01-home.png" alt="雾蓝默认工作台"><figcaption>蓝灰色调、独立项目栏、轻柔层次；代码区与辅助区域以留白分开。</figcaption></section><section class="cell"><h2>暖纸<span class="tag">一体侧栏</span></h2><img src="png/paper/B01-home.png" alt="暖纸默认工作台"><figcaption>暖白底色、项目与文件整合到同一侧栏；弱化边界，强调阅读连续性。</figcaption></section><section class="cell"><h2>深空<span class="tag">顶部项目标签</span></h2><img src="png/orbit/B01-home.png" alt="深空默认工作台"><figcaption>深蓝灰表面、顶部项目标签；代码区横向展开，辅助工具通过侧面板出现。</figcaption></section><section class="cell"><h2>石墨<span class="tag">紧凑工具栏</span></h2><img src="png/graphite/B01-home.png" alt="石墨默认工作台"><figcaption>中性灰、细分隔线与小圆角；保留键盘工具的精确感，减少装饰与面板间隙。</figcaption></section><section class="cell"><h2>青瓷<span class="tag">可折叠导航</span></h2><img src="png/celadon/B01-home.png" alt="青瓷默认工作台"><figcaption>浅青绿色、宽项目切换器与可折叠导航；文件和搜索使用同一片侧栏空间。</figcaption></section><section class="cell"><h2>鸢尾<span class="tag">Expressive 分区</span></h2><img src="png/iris/B01-home.png" alt="鸢尾默认工作台"><figcaption>紫色调、大圆角、明显的选中形状和宽松节奏；项目导航与文件区域各自成组。</figcaption></section><section class="cell"><h2>砂岩<span class="tag">展开式项目目录</span></h2><img src="png/sand/B01-home.png" alt="砂岩默认工作台"><figcaption>低饱和暖色、显示完整名称的项目目录；多项目可读性优先，减少对缩写的记忆。</figcaption></section><section class="cell"><h2>极光<span class="tag">底部项目栏</span></h2><img src="png/aurora/B01-home.png" alt="极光默认工作台"><figcaption>深石墨表面与青色强调；项目切换放到底部，顶部保留搜索与当前任务。</figcaption></section></main><footer>Horizon · Material-inspired desktop workbench · 交互原型 / 非桌面应用实测</footer></body></html>
