href="pdf/horizon-customization.pdf">UI 定制设计册</a><a id="style-pdf" href="pdf/horizon-mist.pdf">当前风格完整 PDF</a></p></header><nav><label>风格 <select id="style"><option value="mist">雾蓝 · 分区工作台</option><option value="paper">暖纸 · 一体侧栏</option><option value="orbit">深空 · 顶部项目标签</option><option value="graphite">石墨 · 紧凑工具栏</option><option value="celadon">青瓷 · 可折叠导航</option><option value="iris">鸢尾 · Expressive 分区</option><option value="sand">砂岩 · 展开式项目目录</option><option value="aurora">极光 · 底部项目栏</option></select></label><label>分组 <select id="group"><option value="all">全部场景</option><option>开始与项目</option><option>阅读与编辑</option><option>Git 工作流</option><option>AI 工作流</option><option>终端</option><option>插件中心</option><option>设置</option><option>状态与适配</option><option>设计规范</option></select></label></nav><main class="gallery"><figure data-style="mist" data-group="开始与项目" ><a href="png/mist/A01-welcome.png" target="_blank"><img src="png/mist/A01-welcome.png" alt="雾蓝 · 首次打开" loading="lazy"></a><figcaption><strong>A01 · 首次打开</strong><p>无需登录，先打开本地项目；AI 与插件不进入首次启动必填流程。</p></figcaption></figure><figure data-style="mist" data-group="开始与项目" ><a href="png/mist/A02-projects.png" target="_blank"><img src="png/mist/A02-projects.png" alt="雾蓝 · 工作区与项目总览" loading="lazy"></a><figcaption><strong>A02 · 工作区与项目总览</strong><p>工作区分组、项目搜索、固定项目、最近访问与后台休眠状态。</p></figcaption></figure><figure data-style="mist" data-group="开始与项目" ><a href="png/mist/A03-workspace-create.png" target="_blank"><img src="png/mist/A03-workspace-create.png" alt="雾蓝 · 创建工作区" loading="lazy"></a><figcaption><strong>A03 · 创建工作区</strong><p>工作区是项目集合，创建不会搬动磁盘文件。</p></figcaption></figure><figure data-style="mist" data-group="开始与项目" ><a href="png/mist/A04-project-add.png" target="_blank"><img src="png/mist/A04-project-add.png" alt="雾蓝 · 添加本地项目" loading="lazy"></a><figcaption><strong>A04 · 添加本地项目</strong><p>选择目录、显示名与所属工作区；已有项目去重后直接打开。</p></figcaption></figure><figure data-style="mist" data-group="开始与项目" ><a href="png/mist/A05-clone.png" target="_blank"><img src="png/mist/A05-clone.png" alt="雾蓝 · 克隆仓库" loading="lazy"></a><figcaption><strong>A05 · 克隆仓库</strong><p>仓库地址、目标目录、克隆进度、取消与完成后的打开操作。</p></figcaption></figure><figure data-style="mist" data-group="开始与项目" ><a href="png/mist/A06-project-menu.png" target="_blank"><img src="png/mist/A06-project-menu.png" alt="雾蓝 · 项目操作菜单" loading="lazy"></a><figcaption><strong>A06 · 项目操作菜单</strong><p>固定、重命名显示名、在新窗口打开、休眠、从工作区移除；移除不删除磁盘文件。</p></figcaption></figure><figure data-style="mist" data-group="阅读与编辑" ><a href="png/mist/B01-home.png" target="_blank"><img src="png/mist/B01-home.png" alt="雾蓝 · 默认工作台" loading="lazy"></a><figcaption><strong>B01 · 默认工作台</strong><p>项目导航、文件树与代码区常驻；AI 和终端关闭；标签属于当前项目。</p></figcaption></figure><figure data-style="mist" data-group="阅读与编辑" ><a href="png/mist/B02-file-menu.png" target="_blank"><img src="png/mist/B02-file-menu.png" alt="雾蓝 · 文件操作" loading="lazy"></a><figcaption><strong>B02 · 文件操作</strong><p>新建文件或目录、重命名、复制路径、系统中显示与移到废纸篓。</p></figcaption></figure><figure data-style="mist" data-group="阅读与编辑" ><a href="png/mist/B03-quick-open.png" target="_blank"><img src="png/mist/B03-quick-open.png" alt="雾蓝 · 快速打开与命令" loading="lazy"></a><figcaption><strong>B03 · 快速打开与命令</strong><p>统一入口搜索文件，使用 > 进入命令；键盘导航并显示快捷键。</p></figcaption></figure><figure data-style="mist" data-group="阅读与编辑" ><a href="png/mist/B04-search.png" target="_blank"><img src="png/mist/B04-search.png" alt="雾蓝 · 项目内搜索" loading="lazy"></a><figcaption><strong>B04 · 项目内搜索</strong><p>按文件分组结果，显示匹配上下文；范围与大小写选项保留在搜索区域。</p></figcaption></figure><figure data-style="mist" data-group="阅读与编辑" ><a href="png/mist/B05-search-empty.png" target="_blank"><img src="png/mist/B05-search-empty.png" alt="雾蓝 · 搜索无结果" loading="lazy"></a><figcaption><strong>B05 · 搜索无结果</strong><p>保留查询，提供取消限制与修改搜索范围；不清空用户输入。</p></figcaption></figure><figure data-style="mist" data-group="阅读与编辑" ><a href="png/mist/B06-edit.png" target="_blank"><img src="png/mist/B06-edit.png" alt="雾蓝 · 轻量编辑与未保存" loading="lazy"></a><figcaption><strong>B06 · 轻量编辑与未保存</strong><p>未保存使用标签圆点；Git 修改使用 M。磁盘变化和未保存状态分别表达。</p></figcaption></figure><figure data-style="mist" data-group="阅读与编辑" ><a href="png/mist/B07-preview.png" target="_blank"><img src="png/mist/B07-preview.png" alt="雾蓝 · 分栏预览" loading="lazy"></a><figcaption><strong>B07 · 分栏预览</strong><p>Markdown 源码与预览并列；预览是可选插件，可单独关闭。</p></figcaption></figure><figure data-style="mist" data-group="阅读与编辑" ><a href="png/mist/B08-unsaved.png" target="_blank"><img src="png/mist/B08-unsaved.png" alt="雾蓝 · 关闭未保存文件" loading="lazy"></a><figcaption><strong>B08 · 关闭未保存文件</strong><p>保存、放弃本次编辑、取消；取消返回原上下文。</p></figcaption></figure><figure data-style="mist" data-group="阅读与编辑" ><a href="png/mist/B09-large-file.png" target="_blank"><img src="png/mist/B09-large-file.png" alt="雾蓝 · 大文件阅读" loading="lazy"></a><figcaption><strong>B09 · 大文件阅读</strong><p>显示文件大小与当前加载范围，允许继续加载或用系统应用打开。</p></figcaption></figure><figure data-style="mist" data-group="阅读与编辑" ><a href="png/mist/B10-outline.png" target="_blank"><img src="png/mist/B10-outline.png" alt="雾蓝 · 文件结构与符号" loading="lazy"></a><figcaption><strong>B10 · 文件结构与符号</strong><p>结构导航复用侧栏；基础标题结构可用，语义符号由语言插件提供。</p></figcaption></figure><figure data-style="mist" data-group="Git 工作流" ><a href="png/mist/C01-git-changes.png" target="_blank"><img src="png/mist/C01-git-changes.png" alt="雾蓝 · 更改与行内差异" loading="lazy"></a><figcaption><strong>C01 · 更改与行内差异</strong><p>未暂存与已暂存分组；点击不同组展示对应差异。</p></figcaption></figure><figure data-style="mist" data-group="Git 工作流" ><a href="png/mist/C02-git-commit.png" target="_blank"><img src="png/mist/C02-git-commit.png" alt="雾蓝 · 暂存与提交" loading="lazy"></a><figcaption><strong>C02 · 暂存与提交</strong><p>提交范围明确显示已暂存文件；提交信息为空或没有暂存时禁用提交。</p></figcaption></figure><figure data-style="mist" data-group="Git 工作流" ><a href="png/mist/C03-git-history.png" target="_blank"><img src="png/mist/C03-git-history.png" alt="雾蓝 · 提交历史" loading="lazy"></a><figcaption><strong>C03 · 提交历史</strong><p>紧凑历史列表与提交详情；按提交查看文件差异。</p></figcaption></figure><figure data-style="mist" data-group="Git 工作流" ><a href="png/mist/C04-git-branch.png" target="_blank"><img src="png/mist/C04-git-branch.png" alt="雾蓝 · 分支与远端同步" loading="lazy"></a><figcaption><strong>C04 · 分支与远端同步</strong><p>当前分支、搜索、新建分支、上游状态、拉取与推送。</p></figcaption></figure><figure data-style="mist" data-group="Git 工作流" ><a href="png/mist/C05-git-conflict.png" target="_blank"><img src="png/mist/C05-git-conflict.png" alt="雾蓝 · 合并冲突处理" loading="lazy"></a><figcaption><strong>C05 · 合并冲突处理</strong><p>当前版本、传入版本与结果区域；逐处解决后标记完成。</p></figcaption></figure><figure data-style="mist" data-group="Git 工作流" ><a href="png/mist/C06-git-discard.png" target="_blank"><img src="png/mist/C06-git-discard.png" alt="雾蓝 · 放弃更改确认" loading="lazy"></a><figcaption><strong>C06 · 放弃更改确认</strong><p>明确受影响文件与操作后果，危险动作不设为默认聚焦按钮。</p></figcaption></figure><figure data-style="mist" data-group="Git 工作流" ><a href="png/mist/C07-git-error.png" target="_blank"><img src="png/mist/C07-git-error.png" alt="雾蓝 · 同步失败与重试" loading="lazy"></a><figcaption><strong>C07 · 同步失败与重试</strong><p>保留当前更改，展示失败原因与可执行下一步；凭据从系统流程获取。</p></figcaption></figure><figure data-style="mist" data-group="Git 工作流" ><a href="png/mist/C08-git-split.png" target="_blank"><img src="png/mist/C08-git-split.png" alt="雾蓝 · 并排差异" loading="lazy"></a><figcaption><strong>C08 · 并排差异</strong><p>前后版本并排；窄窗口自动使用行内差异，避免压缩代码到无法阅读。</p></figcaption></figure><figure data-style="mist" data-group="AI 工作流" ><a href="png/mist/D01-ai-empty.png" target="_blank"><img src="png/mist/D01-ai-empty.png" alt="雾蓝 · AI 尚未连接" loading="lazy"></a><figcaption><strong>D01 · AI 尚未连接</strong><p>说明可接入能力，连接入口进入设置；不阻断文件或 Git 使用。</p></figcaption></figure><figure data-style="mist" data-group="AI 工作流" ><a href="png/mist/D02-ai-chat.png" target="_blank"><img src="png/mist/D02-ai-chat.png" alt="雾蓝 · 按项目对话" loading="lazy"></a><figcaption><strong>D02 · 按项目对话</strong><p>当前项目、所选上下文、模型与发送状态可见；聊天默认不执行写入。</p></figcaption></figure><figure data-style="mist" data-group="AI 工作流" ><a href="png/mist/D03-ai-context.png" target="_blank"><img src="png/mist/D03-ai-context.png" alt="雾蓝 · 上下文选择" loading="lazy"></a><figcaption><strong>D03 · 上下文选择</strong><p>显式选择文件、选区或 Git 差异，展示将发送的范围和移除入口。</p></figcaption></figure><figure data-style="mist" data-group="AI 工作流" ><a href="png/mist/D04-ai-running.png" target="_blank"><img src="png/mist/D04-ai-running.png" alt="雾蓝 · 任务执行中" loading="lazy"></a><figcaption><strong>D04 · 任务执行中</strong><p>任务模式单独启用；显示当前步骤、修改文件与停止操作。</p></figcaption></figure><figure data-style="mist" data-group="AI 工作流" ><a href="png/mist/D05-ai-permission.png" target="_blank"><img src="png/mist/D05-ai-permission.png" alt="雾蓝 · 待授权操作" loading="lazy"></a><figcaption><strong>D05 · 待授权操作</strong><p>命令、工作目录与本次影响明确列出；允许一次或拒绝，不默认永久放行。</p></figcaption></figure><figure data-style="mist" data-group="AI 工作流" ><a href="png/mist/D06-ai-review.png" target="_blank"><img src="png/mist/D06-ai-review.png" alt="雾蓝 · 审查 AI 修改" loading="lazy"></a><figcaption><strong>D06 · 审查 AI 修改</strong><p>文件列表与 diff 联动，可按文件接受或撤回；不自动提交 Git。</p></figcaption></figure><figure data-style="mist" data-group="AI 工作流" ><a href="png/mist/D07-ai-error.png" target="_blank"><img src="png/mist/D07-ai-error.png" alt="雾蓝 · 连接失败与重试" loading="lazy"></a><figcaption><strong>D07 · 连接失败与重试</strong><p>保留草稿与上下文；可重试、切换连接或打开连接设置。</p></figcaption></figure><figure data-style="mist" data-group="终端" ><a href="png/mist/E01-terminal.png" target="_blank"><img src="png/mist/E01-terminal.png" alt="雾蓝 · 按需终端" loading="lazy"></a><figcaption><strong>E01 · 按需终端</strong><p>底部终端绑定项目目录；关闭面板和结束进程是不同操作。</p></figcaption></figure><figure data-style="mist" data-group="插件中心" ><a href="png/mist/E02-plugins.png" target="_blank"><img src="png/mist/E02-plugins.png" alt="雾蓝 · 插件中心 · 发现扩展" loading="lazy"></a><figcaption><strong>E02 · 插件中心 · 发现扩展</strong><p>固定入口；分类发现能力，区分已安装、已启用与按需运行。</p></figcaption></figure><figure data-style="mist" data-group="插件中心" ><a href="png/mist/E03-plugin-detail.png" target="_blank"><img src="png/mist/E03-plugin-detail.png" alt="雾蓝 · 插件详情与贡献点" loading="lazy"></a><figcaption><strong>E03 · 插件详情与贡献点</strong><p>完整详情页展示来源、版本、权限、激活条件和界面贡献点。</p></figcaption></figure><figure data-style="mist" data-group="插件中心" ><a href="png/mist/E04-plugin-error.png" target="_blank"><img src="png/mist/E04-plugin-error.png" alt="雾蓝 · 扩展失败与诊断" loading="lazy"></a><figcaption><strong>E04 · 扩展失败与诊断</strong><p>显示具体失败与日志，可重试或在当前项目停用。</p></figcaption></figure><figure data-style="mist" data-group="插件中心" ><a href="png/mist/E05-plugin-installed.png" target="_blank"><img src="png/mist/E05-plugin-installed.png" alt="雾蓝 · 已安装与作用域" loading="lazy"></a><figcaption><strong>E05 · 已安装与作用域</strong><p>查看已安装扩展，按作用域筛选；启用、停用与配置就近操作。</p></figcaption></figure><figure data-style="mist" data-group="插件中心" ><a href="png/mist/E06-plugin-install.png" target="_blank"><img src="png/mist/E06-plugin-install.png" alt="雾蓝 · 本地扩展包安装" loading="lazy"></a><figcaption><strong>E06 · 本地扩展包安装</strong><p>选择扩展包，查看来源、兼容性和安装后启用范围。</p></figcaption></figure><figure data-style="mist" data-group="插件中心" ><a href="png/mist/E07-plugin-installing.png" target="_blank"><img src="png/mist/E07-plugin-installing.png" alt="雾蓝 · 安装进度与取消" loading="lazy"></a><figcaption><strong>E07 · 安装进度与取消</strong><p>检查、授权、安装与注册入口分步展示；取消不启用半成品。</p></figcaption></figure><figure data-style="mist" data-group="插件中心" ><a href="png/mist/E08-plugin-permissions.png" target="_blank"><img src="png/mist/E08-plugin-permissions.png" alt="雾蓝 · 首次安装授权" loading="lazy"></a><figcaption><strong>E08 · 首次安装授权</strong><p>在所选范围内授予声明的能力；未同意时不能继续安装。</p></figcaption></figure><figure data-style="mist" data-group="插件中心" ><a href="png/mist/E09-plugin-settings.png" target="_blank"><img src="png/mist/E09-plugin-settings.png" alt="雾蓝 · 插件设置与项目覆盖" loading="lazy"></a><figcaption><strong>E09 · 插件设置与项目覆盖</strong><p>插件独立配置；全局默认、项目覆盖与恢复继承。</p></figcaption></figure><figure data-style="mist" data-group="插件中心" ><a href="png/mist/E10-plugin-updates.png" target="_blank"><img src="png/mist/E10-plugin-updates.png" alt="雾蓝 · 更新管理" loading="lazy"></a><figcaption><stron </p></figcaption></figure><figure data-style="paper" data-group="阅读与编辑" hidden><a href="png/paper/B06-edit.png" target="_blank"><img src="png/paper/B06-edit.png" alt="暖纸 · 轻量编辑与未保存" loading="lazy"></a><figcaption><strong>B06 · 轻量编辑与未保存</strong><p>未保存使用标签圆点；Git 修改使用 M。磁盘变化和未保存状态分别表达。</p></figcaption></figure><figure data-style="paper" data-group="阅读与编辑" hidden><a href="png/paper/B07-preview.png" target="_blank"><img src="png/paper/B07-preview.png" alt="暖纸 · 分栏预览" loading="lazy"></a><figcaption><strong>B07 · 分栏预览</strong><p>Markdown 源码与预览并列；预览是可选插件，可单独关闭。</p></figcaption></figure><figure data-style="paper" data-group="阅读与编辑" hidden><a href="png/paper/B08-unsaved.png" target="_blank"><img src="png/paper/B08-unsaved.png" alt="暖纸 · 关闭未保存文件" loading="lazy"></a><figcaption><strong>B08 · 关闭未保存文件</strong><p>保存、放弃本次编辑、取消；取消返回原上下文。</p></figcaption></figure><figure data-style="paper" data-group="阅读与编辑" hidden><a href="png/paper/B09-large-file.png" target="_blank"><img src="png/paper/B09-large-file.png" alt="暖纸 · 大文件阅读" loading="lazy"></a><figcaption><strong>B09 · 大文件阅读</strong><p>显示文件大小与当前加载范围，允许继续加载或用系统应用打开。</p></figcaption></figure><figure data-style="paper" data-group="阅读与编辑" hidden><a href="png/paper/B10-outline.png" target="_blank"><img src="png/paper/B10-outline.png" alt="暖纸 · 文件结构与符号" loading="lazy"></a><figcaption><strong>B10 · 文件结构与符号</strong><p>结构导航复用侧栏；基础标题结构可用，语义符号由语言插件提供。</p></figcaption></figure><figure data-style="paper" data-group="Git 工作流" hidden><a href="png/paper/C01-git-changes.png" target="_blank"><img src="png/paper/C01-git-changes.png" alt="暖纸 · 更改与行内差异" loading="lazy"></a><figcaption><strong>C01 · 更改与行内差异</strong><p>未暂存与已暂存分组；点击不同组展示对应差异。</p></figcaption></figure><figure data-style="paper" data-group="Git 工作流" hidden><a href="png/paper/C02-git-commit.png" target="_blank"><img src="png/paper/C02-git-commit.png" alt="暖纸 · 暂存与提交" loading="lazy"></a><figcaption><strong>C02 · 暂存与提交</strong><p>提交范围明确显示已暂存文件；提交信息为空或没有暂存时禁用提交。</p></figcaption></figure><figure da er" data-group="AI 工作流" hidden><a href="png/paper/D02-ai-chat.png" target="_blank"><img src="png/paper/D02-ai-chat.png" alt="暖纸 · 按项目对话" loading="lazy"></a><figcaption><strong>D02 · 按项目对话</strong><p>当前项目、所选上下文、模型与发送状态可见；聊天默认不执行写入。</p></figcaption></figure><figure data-style="paper" data-group="AI 工作流" hidden><a href="png/paper/D03-ai-context.png" target="_blank"><img src="png/paper/D03-ai-context.png" alt="暖纸 · 上下文选择" loading="lazy"></a><figcaption><strong>D03 · 上下文选择</strong><p>显式选择文件、选区或 Git 差异，展示将发送的范围和移除入口。</p></figcaption></figure><figure data-style="paper" data-group="AI 工作流" hidden><a href="png/paper/D04-ai-running.png" target="_blank"><img src="png/paper/D04-ai-running.png" alt="暖纸 · 任务执行中" loading="lazy"></a><figcaption><strong>D04 · 任务执行中</strong><p>任务模式单独启用；显示当前步骤、修改文件与停止操作。</p></figcaption></figure><figure data-style="paper" data-group="AI 工作流" hidden><a href="png/paper/D05-ai-permission.png" target="_blank"><img src="png/paper/D05-ai-permission.png" alt="暖纸 · 待授权操作" loading="lazy"></a><figcaption><strong>D05 · 待授权操作</strong><p>命令、工作目录与本次影响明确列出；允许一次或拒绝，不默认永久放行。</p></figcaption></figure><figure data-style="paper" data-group="AI 工作流" hidden><a href="png/paper/D06-ai-review.png" target="_blank"><img src="png/paper/D06-ai-review.png" alt="暖纸 · 审查 AI 修改" loading="lazy"></a><figcaption><strong>D06 · 审查 AI 修改</strong><p>文件列表与 diff 联动，可按文件接受或撤回；不自动提交 Git。</p></figcaption></figure><figure data-style="paper" data-group="AI 工作流" hidden><a href="png/paper/D07-ai-error.png" target="_blank"><img src="png/paper/D07-ai-error.png" alt="暖纸 · 连接失败与重试" loading="lazy"></a><figcaption><strong>D07 · 连接失败与重试</strong><p>保留草稿与上下文；可重试、切换连接或打开连接设置。</p></figcaption></figure><figure data-style="paper" data-group="终端" hidden><a href="png/paper/E01-terminal.png" target="_blank"><img src="png/paper/E01-terminal.png" alt="暖纸 · 按需终端" loading="lazy"></a><figcaption><strong>E01 · 按需终端</strong><p>底部终端绑定项目目录；关闭面板和结束进程是不同操作。</p></figcaption></figure><figure data-style="paper" data-group="插件中心" oading="lazy"></a><figcaption><strong>F13 · 外观组合</strong><p>保存、应用、导入导出自己的布局、主题、尺寸和背景组合。</p></figcaption></figure><figure data-style="paper" data-group="设置" hidden><a href="png/paper/F14-settings-layout-recovery.png" target="_blank"><img src="png/paper/F14-settings-layout-recovery.png" alt="暖纸 · 布局恢复" loading="lazy"></a><figcaption><strong>F14 · 布局恢复</strong><p>布局启用失败保留上次有效布局、未保存内容和任务，可进入插件管理恢复。</p></figcaption></figure><figure data-style="paper" data-group="状态与适配" hidden><a href="png/paper/G01-loading.png" target="_blank"><img src="png/paper/G01-loading.png" alt="暖纸 · 工作区加载中" loading="lazy"></a><figcaption><strong>G01 · 工作区加载中</strong><p>先显示窗口和项目结构；局部渐进加载，取消操作始终可用。</p></figcaption></figure><figure data-style="paper" data-group="状态与适配" hidden><a href="png/paper/G02-file-error.png" target="_blank"><img src="png/paper/G02-file-error.png" alt="暖纸 · 文件不可用" loading="lazy"></a><figcaption><strong>G02 · 文件不可用</strong><p>区分权限不足与路径失效，提供重试、重新定位和关闭标签。</p></figcaption></figure><figure data-style="paper" data-group="状态与适配" hidden><a href="png/paper/G03-sleep.png" target="_blank"><img src="png/paper/G03-sleep.png" alt="暖纸 · 后台项目休眠" loading="lazy"></a><figcaption><strong>G03 · 后台项目休眠</strong><p>保留会话与未保存文档，停止可恢复的后台服务；切回时恢复。</p></figcaption></figure><figure data-style="paper" data-group="状态与适配" hidden><a href="png/paper/G04-focus.png" target="_blank"><img src="png/paper/G04-focus.png" alt="暖纸 · 专注模式" loading="lazy"></a><figcaption><strong>G04 · 专注模式</strong><p>一次收起辅助区域，退出后恢复原布局。</p></figcaption></figure><figure data-style="paper" data-group="状态与适配" hidden><a href="png/paper/G05-dark.png" target="_blank"><img src="png/paper/G05-dark.png" alt="暖纸 · 深色主题" loading="lazy"></a><figcaption><strong>G05 · 深色主题</strong><p>保持语义色、层级与对比度；不通过简单反色生成。</p></figcaption></figure><figure data-style="paper" data-group="状态与适配" hidden><a href="png/paper/G06-narrow.png" target="_blank"><img src="png/paper/G06-narrow.png" alt="暖纸 · 窄窗口" loading="lazy"></a><figcaption><strong>G06 · 窄窗口</strong><p>侧栏变为可关闭浮层，AI 使用覆盖式面板；核心操作保留。</p></figcaption></figure><figure data-style="paper" data-group="状态与适配" hidden><a href="png/paper/G07-windows.png" target="_blank"><img src="png/paper/G07-windows.png" alt="暖纸 · Windows 窗口" loading="lazy"></a><figcaption><strong>G07 · Windows 窗口</strong><p>使用 Windows 窗口控制和 Ctrl 系快捷键，功能结构与 macOS 一致。</p></figcaption></figure><figure data-style="paper" data-group="设计规范" hidden><a href="png/paper/H01-architecture.png" target="_blank"><img src="png/paper/H01-architecture.png" alt="暖纸 · 信息架构" loading="lazy"></a><figcaption><strong>H01 · 信息架构</strong><p>工作区、项目、文件、工具与全局设置之间的关系。</p></figcaption></figure><figure data-style="paper" data-group="设计规范" hidden><a href="png/paper/H02-tokens.png" target="_blank"><img src="png/paper/H02-tokens.png" alt="暖纸 · 视觉令牌" loading="lazy"></a><figcaption><strong>H02 · 视觉令牌</strong><p>颜色、字体、间距、圆角、层级与图标规范。</p></figcaption></figure><figure data-style="paper" data-group="设计规范" hidden><a href="png/paper/H03-components.png" target="_blank"><img src="png/paper/H03-components.png" alt="暖纸 · 组件与反馈状态" loading="lazy"></a><figcaption><strong>H03 · 组件与反馈状态</strong><p>按钮、输入、开关、标签、菜单、通知及加载、禁用、错误状态。</p></figcaption></figure><figure data-style="paper" data-group="设计规范" hidden><a href="png/paper/H04-adaptive.png" target="_blank"><img src="png/paper/H04-adaptive.png" alt="暖纸 · 响应式布局规则" loading="lazy"></a><figcaption><strong>H04 · 响应式布局规则</strong><p>固定尺寸、可拖动边界、面板最小宽度与收起优先级。</p></figcaption></figure><figure data-style="paper" data-group="设计规范" hidden><a href="png/paper/H05-flows.png" target="_blank"><img src="png/paper/H05-flows.png" alt="暖纸 · 关键操作流程" loading="lazy"></a><figcaption><strong>H05 · 关键操作流程</strong><p>打开项目、审查改动、AI 协作、扩展启用四条主路径。</p></figcaption></figure><figure data-style="orbit" data-group="开始与项目" hidden><a href="png/orbit/A01-welcome.png" target="_blank"><img src="png/orbit/A01-welcome.png" alt="深空 · 首次打开" loading="lazy"></a><figcaption><strong>A01 · 首次打开</strong><p>无需登录，先打开本地项目；AI 与插件不进入首次启动必填流程。</p></figcaption></figure><figure data-style="orbit" data-group="开始与项目" hidden><a href="png/orbit/A02-projects.png" target="_blank"><img src="png/orbit/A02-projects.png" alt="深空 · 工作区与项目总览" loading="lazy"></a><figcaption><strong>A02 · 工作区与项目总览</strong><p>工作区分组、项目搜索、固定项目、最近访问与后台休眠状态。</p></figcaption></figure><figure data-style="orbit" data-group="开始与项目" hidden><a href="png/orbit/A03-workspace-create.png" target="_blank"><img src="png/orbit/A03-workspace-create.png" alt="深空 · 创建工作区" loading="lazy"></a><figcaption><strong>A03 · 创建工作区</strong><p>工作区是项目集合，创建不会搬动磁盘文件。</p></figcaption></figure><figure data-style="orbit" data-group="开始与项目" hidden><a href="png/orbit/A04-project-add.png" target="_blank"><img src="png/orbit/A04-project-add.png" alt="深空 · 添加本地项目" loading="lazy"></a><figcaption><strong>A04 · 添加本地项目</strong><p>选择目录、显示名与所属工作区；已有项目去重后直接打开。</p></figcaption></figure><figure data-style="orbit" data-group="开始与项目" hidden><a href="png/orbit/A05-clone.png" target="_blank"><img src="png/orbit/A05-clone.png" alt="深空 · 克隆仓库" loading="lazy"></a><figcaption><strong>A05 · 克隆仓库</strong><p>仓库地址、目标目录、克隆进度、取消与完成后的打开操作。</p></figcaption></figure><figure data-style="orbit" data-group="开始与项目" hidden><a href="png/orbit/A06-project-menu.png" target="_blank"><img src="png/orbit/A06-project-menu.png" alt="深空 · 项目操作菜单" loading="lazy"></a><figcaption><strong>A06 · 项目操作菜单</strong><p>固定、重命名显示名、在新窗口打开、休眠、从工作区移除；移除不删除磁盘文件。</p></figcaption></figure><figure data-style="orbit" data-group="阅读与编辑" hidden><a href="png/orbit/B01-home.png" target="_blank"><img src="png/orbit/B01-home.png" alt="深空 · 默认工作台" loading="lazy"></a><figcaption><strong>B01 · 默认工作台</strong><p>项目导航、文件树与代码区常驻；AI 和终端关闭；标签属于当前项目。</p></figcaption></figure><figure data-style="orbit" data-group="阅读与编辑" hidden><a href="png/orbit/B02-file-menu.png" target="_blank"><img src="png/orbit/B02-file-menu.png" alt="深空 · 文件操作" loading="lazy"></a><figcaption><strong>B02 · 文件操作</strong><p>新建文件或目录、重命名、复制路径、系统中显示与移到废纸篓。</p></figcaption></figure><figure data-style="orbit" data-group="阅读与编辑" hidden><a href="png/orbit/B03-quick-open.png" target="_blank"><img src="png/orbit/B03-quick-open.png" alt="深空 · 快速打开与命令" loading="lazy"></a><figcaption><strong>B03 · 快速打开与命令</strong><p>统一入口搜索文件，使用 > 进入命令；键盘导航并显示快捷键。</p></figcaption></figure><figure data-style="orbit" data-group="阅读与编辑" hidden><a href="png/orbit/B04-search.png" target="_blank"><img src="png/orbit/B04-search.png" alt="深空 · 项目内搜索" loading="lazy"></a><figcaption><strong>B04 · 项目内搜索</strong><p>按文件分组结果，显示匹配上下文；范围与大小写选项保留在搜索区域。</p></figcaption></figure><figure data-style="orbit" data-group="阅读与编辑" hidden><a href="png/orbit/B05-search-empty.png" target="_blank"><img src="png/orbit/B05-search-empty.png" alt="深空 · 搜索无结果" loading="lazy"></a><figcaption><strong>B05 · 搜索无结果</strong><p>保留查询，提供取消限制与修改搜索范围；不清空用户输入。</p></figcaption></figure><figure data-style="orbit" data-group="阅读与编辑" hidden><a href="png/orbit/B06-edit.png" target="_blank"><img src="png/orbit/B06-edit.png" alt="深空 · 轻量编辑与未保存" loading="lazy"></a><figcaption><strong>B06 · 轻量编辑与未保存</strong><p>未保存使用标签圆点；Git 修改使用 M。磁盘变化和未保存状态分别表达。</p></figcaption></figure><figure data-style="orbit" data-group="阅读与编辑" hidden><a href="png/orbit/B07-preview.png" target="_blank"><img src="png/orbit/B07-preview.png" alt="深空 · 分栏预览" loading="lazy"></a><figcaption><strong>B07 · 分栏预览</strong><p>Markdown 源码与预览并列；预览是可选插件，可单独关闭。</p></figcaption></figure><figure data-style="orbit" data-group="阅读与编辑" hidden><a href="png/orbit/B08-unsaved.png" target="_blank"><img src="png/orbit/B08-unsaved.png" alt="深空 · 关闭未保存文件" loading="lazy"></a><figcaption><strong>B08 · 关闭未保存文件</strong><p>保存、放弃本次编辑、取消；取消返回原上下文。</p></figcaption></figure><figure data-style="orbit" data-group="阅读与编辑" hidden><a href="png/orbit/B09-large-file.png" target="_blank"><img src="png/orbit/B09-large-file.png" alt="深空 · 大文件阅读" loading="lazy"></a><figcaption><strong>B09 · 大文件阅读</strong><p>显示文件大小与当前加载范围，允许继续加载或用系统应用打开。</p></figcaption></figure><figure data-style="orbit" data-group="阅读与编辑" hidden><a href="png/orbit/B10-outline.png" target="_blank"><img src="png/orbit/B10-outline.png" alt="深空 · 文件结构与符号" loading="lazy"></a><figcaption><strong>B10 · 文件结构与符号</strong><p>结构导航复用侧栏；基础标题结构可用，语义符号由语言插件提供。</p></figcaption></figure><figure data-style="orbit" data-group="Git 工作流" hidden><a href="png/orbit/C01-git-changes.png" target="_blank"><img src="png/orbit/C01-git-changes.png" alt="深空 · 更改与行内差异" loading="lazy"></a><figcaption><strong>C01 · 更改与行内差异</strong><p>未暂存与已暂存分组；点击不同组展示对应差异。</p></figcaption></figure><figure data-style="orbit" data-group="Git 工作流" hidden><a href="png/orbit/C02-git-commit.png" target="_blank"><img src="png/orbit/C02-git-commit.png" alt="深空 · 暂存与提交" loading="lazy"></a><figcaption><strong>C02 · 暂存与提交</strong><p>提交范围明确显示已暂存文件；提交信息为空或没有暂存时禁用提交。</p></figcaption></figure><figure data-style="orbit" data-group="Git 工作流" hidden><a href="png/orbit/C03-git-history.png" target="_blank"><img src="png/orbit/C03-git-history.png" alt="深空 · 提交历史" loading="lazy"></a><figcaption><strong>C03 · 提交历史</strong><p>紧凑历史列表与提交详情；按提交查看文件差异。</p></figcaption></figure><figure data-style="orbit" data-group="Git 工作流" hidden><a href="png/orbit/C04-git-branch.png" target="_blank"><img src="png/orbit/C04-git-branch.png" alt="深空 · 分支与远端同步" loading="lazy"></a><figcaption><strong>C04 · 分支与远端同步</strong><p>当前分支、搜索、新建分支、上游状态、拉取与推送。</p></figcaption></figure><figure data-style="orbit" data-group="Git 工作流" hidden><a href="png/orbit/C05-git-conflict.png" target="_blank"><img src="png/orbit/C05-git-conflict.png" alt="深空 · 合并冲突处理" loading="lazy"></a><figcaption><strong>C05 · 合并冲突处理</strong><p>当前版本、传入版本与结果区域；逐处解决后标记完成。</p></figcaption></figure><figure data-style="orbit" data-group="Git 工作流" hidden><a href="png/orbit/C06-git-discard.png" target="_blank"><img src="png/orbit/C06-git-discard.png" alt="深空 · 放弃更改确认" loading="lazy"></a><figcaption><strong>C06 · 放弃更改确认</strong><p>明确受影响文件与操作后果，危险动作不设为默认聚焦按钮。</p></figcaption></figure><figure data-style="orbit" data-group="Git 工作流" hidden><a href="png/orbit/C07-git-error.png" target="_blank"><img src="png/orbit/C07-git-error.png" alt="深空 · 同步失败与重试" loading="lazy"></a><figcaption><strong>C07 · 同步失败与重试</strong><p>保留当前更改，展示失败原因与可执行下一步；凭据从系统流程获取。</p></figcaption></figure><figure data-style="orbit" data-group="Git 工作流" hidden><a href="png/orbit/C08-git-split.png" target="_blank"><img src="png/orbit/C08-git-split.png" alt="深空 · 并排差异" loading="lazy"></a><figcaption><strong>C08 · 并排差异</strong><p>前后版本并排；窄窗口自动使用行内差异，避免压缩代码到无法阅读。</p></figcaption></figure><figure data-style="orbit" data-group="AI 工作流" hidden><a href="png/orbit/D01-ai-empty.png" target="_blank"><img src="png/orbit/D01-ai-empty.png" alt="深空 · AI 尚未连接" loading="lazy"></a><figcaption><strong>D01 · AI 尚未连接</strong><p>说明可接入能力，连接入口进入设置；不阻断文件或 Git 使用。</p></figcaption></figure><figure data-style="orbit" data-group="AI 工作流" hidden><a href="png/orbit/D02-ai-chat.png" target="_blank"><img src="png/orbit/D02-ai-chat.png" alt="深空 · 按项目对话" loading="lazy"></a><figcaption><strong>D02 · 按项目对话</strong><p>当前项目、所选上下文、模型与发送状态可见；聊天默认不执行写入。</p></figcaption></figure><figure data-style="orbit" data-group="AI 工作流" hidden><a href="png/orbit/D03-ai-context.png" target="_blank"><img src="png/orbit/D03-ai-context.png" alt="深空 · 上下文选择" loading="lazy"></a><figcaption><strong>D03 · 上下文选择</strong><p>显式选择文件、选区或 Git 差异，展示将发送的范围和移除入口。</p></figcaption></figure><figure data-style="orbit" data-group="AI 工作流" hidden><a href="png/orbit/D04-ai-running.png" target="_blank"><img src="png/orbit/D04-ai-running.png" alt="深空 · 任务执行中" loading="lazy"></a><figcaption><strong>D04 · 任务执行中</strong><p>任务模式单独启用；显示当前步骤、修改文件与停止操作。</p></figcaption></figure><figure data-style="orbit" data-group="AI 工作流" hidden><a href="png/orbit/D05-ai-permission.png" target="_blank"><img src="png/orbit/D05-ai-permission.png" alt="深空 · 待授权操作" loading="lazy"></a><figcaption><strong>D05 · 待授权操作</strong><p>命令、工作目录与本次影响明确列出；允许一次或拒绝，不默认永久放行。</p></figcaption></figure><figure data-style="orbit" data-group="AI 工作流" hidden><a href="png/orbit/D06-ai-review.png" target="_blank"><img src="png/orbit/D06-ai-review.png" alt="深空 · 审查 AI 修改" loading="lazy"></a><figcaption><strong>D06 · 审查 AI 修改</strong><p>文件列表与 diff 联动，可按文件接受或撤回；不自动提交 Git。</p></figcaption></figure><figure data-style="orbit" data-group="AI 工作流" hidden><a href="png/orbit/D07-ai-error.png" target="_blank"><img src="png/orbit/D07-ai-error.png" alt="深空 · 连接失败与重试" loading="lazy"></a><figcaption><strong>D07 · 连接失败与重试</strong><p>保留草稿与上下文；可重试、切换连接或打开连接设置。</p></figcaption></figure><figure data-style="orbit" data-group="终端" hidden><a href="png/orbit/E01-terminal.png" target="_blank"><img src="png/orbit/E01-terminal.png" alt="深空 · 按需终端" loading="lazy"></a><figcaption><strong>E01 · 按需终端</strong><p>底部终端绑定项目目录；关闭面板和结束进程是不同操作。</p></figcaption></figure><figure data-style="orbit" data-group="插件中心" hidden><a href="png/orbit/E02-plugins.png" target="_blank"><img src="png/orbit/E02-plugins.png" alt="深空 · 插件中心 · 发现扩展" loading="lazy"></a><figcaption><strong>E02 · 插件中心 · 发现扩展</strong><p>固定入口；分类发现能力，区分已安装、已启用与按需运行。</p></figcaption></figure><figure data-style="orbit" data-group="插件中心" hidden><a href="png/orbit/E03-plugin-detail.png" target="_blank"><img src="png/orbit/E03-plugin-detail.png" alt="深空 · 插件详情与贡献点" loading="lazy"></a><figcaption><strong>E03 · 插件详情与贡献点</strong><p>完整详情页展示来源、版本、权限、激活条件和界面贡献点。</p></figcaption></figure><figure data-style="orbit" data-group="插件中心" hidden><a href="png/orbit/E04-plugin-error.png" target="_blank"><img src="png/orbit/E04-plugin-error.png" alt="深空 · 扩展失败与诊断" loading="lazy"></a><figcaption><strong>E04 · 扩展失败与诊断</strong><p>显示具体失败与日志，可重试或在当前项目停用。</p></figcaption></figure><figure data-style="orbit" data-group="插件中心" hidden><a href="png/orbit/E05-plugin-installed.png" target="_blank"><img src="png/orbit/E05-plugin-installed.png" alt="深空 · 已安装与作用域" loading="lazy"></a><figcaption><strong>E05 · 已安装与作用域</strong><p>查看已安装扩展，按作用域筛选；启用、停用与配置就近操作。</p></figcaption></figure><figure data-style="orbit" data-group="插件中心" hidden><a href="png/orbit/E06-plugin-install.png" target="_blank"><i aphite/A06-project-menu.png" target="_blank"><img src="png/graphite/A06-project-menu.png" alt="石墨 · 项目操作菜单" loading="lazy"></a><figcaption><strong>A06 · 项目操作菜单</strong><p>固定、重命名显示名、在新窗口打开、休眠、从工作区移除；移除不删除磁盘文件。</p></figcaption></figure><figure data-style="graphite" data-group="阅读与编辑" hidden><a href="png/graphite/B01-home.png" target="_blank"><img src="png/graphite/B01-home.png" alt="石墨 · 默认工作台" loading="lazy"></a><figcaption><strong>B01 · 默认工作台</strong><p>项目导航、文件树与代码区常驻；AI 和终端关闭；标签属于当前项目。</p></figcaption></figure><figure data-style="graphite" data-group="阅读与编辑" hidden><a href="png/graphite/B02-file-menu.png" target="_blank"><img src="png/graphite/B02-file-menu.png" alt="石墨 · 文件操作" loading="lazy"></a><figcaption><strong>B02 · 文件操作</strong><p>新建文件或目录、重命名、复制路径、系统中显示与移到废纸篓。</p></figcaption></figure><figure data-style="graphite" data-group="阅读与编辑" hidden><a href="png/graphite/B03-quick-open.png" target="_blank"><img src="png/graphite/B03-quick-open.png" alt="石墨 · 快速打开与命令" loading="lazy"></a><figcaption><strong>B03 · 快速打开与命令</strong><p>统一入口搜索文件，使用 > 进入命令；键盘导航并显示快捷键。</p></figcaption></figure><figure data-style="graphite" data-group="阅读与编辑" hidden><a href="png/graphite/B04-search.png" target="_blank"><img src="png/graphite/B04-search.png" alt="石墨 · 项目内搜索" loading="lazy"></a><figcaption><strong>B04 · 项目内搜索</strong><p>按文件分组结果，显示匹配上下文；范围与大小写选项保留在搜索区域。</p></figcaption></figure><figure data-style="graphite" data-group="阅读与编辑" hidden><a href="png/graphite/B05-search-empty.png" target="_blank"><img src="png/graphite/B05-search-empty.png" alt="石墨 · 搜索无结果" loading="lazy"></a><figcaption><strong>B05 · 搜索无结果</strong><p>保留查询，提供取消限制与修改搜索范围；不清空用户输入。</p></figcaption></figure><figure data-style="graphite" data-group="阅读与编辑" hidden><a href="png/graphite/B06-edit.png" target="_blank"><img src="png/graphite/B06-edit.png" alt="石墨 · 轻量编辑与未保存" loading="lazy"></a><figcaption><strong>B06 · 轻量编辑与未保存</strong><p>未保存使用标签圆点；Git 修改使用 M。磁盘变化和未保存状态分别表达。</p></figcaption></figure><figure data-style="graphite" data-group="阅读与编辑" hidden><a href="png/graphite/B07-preview.png" target="_blank"><img src="png/graphite/B07-preview.png" alt="石墨 · 分栏预览" loading="lazy"></a><figcaption><strong>B07 · 分栏预览</strong><p>Markdown 源码与预览并列；预览是可选插件，可单独关闭。</p></figcaption></figure><figure data-style="graphite" data-group="阅读与编辑" hidden><a href="png/graphite/B08-unsaved.png" target="_blank"><img src="png/graphite/B08-unsaved.png" alt="石墨 · 关闭未保存文件" loading="lazy"></a><figcaption><strong>B08 · 关闭未保存文件</strong><p>保存、放弃本次编辑、取消；取消返回原上下文。</p></figcaption></figure><figure data-style="graphite" data-group="阅读与编辑" hidden><a href="png/graphite/B09-large-file.png" target="_blank"><img src="png/graphite/B09-large-file.png" alt="石墨 · 大文件阅读" loading="lazy"></a><figcaption><strong>B09 · 大文件阅读</strong><p>显示文件大小与当前加载范围，允许继续加载或用系统应用打开。</p></figcaption></figure><figure data-style="graphite" data-group="阅读与编辑" hidden><a href="png/graphite/B10-outline.png" target="_blank"><img src="png/graphite/B10-outline.png" alt="石墨 · 文件结构与符号" loading="lazy"></a><figcaption><strong>B10 · 文件结构与符号</strong><p>结构导航复用侧栏；基础标题结构可用，语义符号由语言插件提供。</p></figcaption></figure><figure data-style="graphite" data-group="Git 工作流" hidden><a href="png/graphite/C01-git-changes.png" target="_blank"><img src="png/graphite/C01-git-changes.png" alt="石墨 · 更改与行内差异" loading="lazy"></a><figcaption><strong>C01 · 更改与行内差异</strong><p>未暂存与已暂存分组；点击不同组展示对应差异。</p></figcaption></figure><figure data-style="graphite" data-group="Git 工作流" hidden><a href="png/graphite/C02-git-commit.png" target="_blank"><img src="png/graphite/C02-git-commit.png" alt="石墨 · 暂存与提交" loading="lazy"></a><figcaption><strong>C02 · 暂存与提交</strong><p>提交范围明确显示已暂存文件；提交信息为空或没有暂存时禁用提交。</p></figcaption></figure><figure data-style="graphite" data-group="Git 工作流" hidden><a href="png/graphite/C03-git-history.png" target="_blank"><img src="png/graphite/C03-git-history.png" alt="石墨 · 提交历史" loading="lazy"></a><figcaption><strong>C03 · 提交历史</strong><p>紧凑历史列表与提交详情；按提交查看文件差异。</p></figcaption></figure><figure data-style="graphite" data-group="Git 工作流" hidden><a href="png/graphite/C04-git-branch.png" target="_blank"><img src="png/graphite/C04-git-branch.png" alt="石墨 · 分支与远端同步" loading="lazy"></a><figcaption><strong>C04 · 分支与远端同步</strong><p>当前分支、搜索、新建分支、上游状态、拉取与推送。</p></figcaption></figure><figure data-style="graphite" data-group="Git 工作流" hidden><a href="png/graphite/C05-git-conflict.png" target="_blank"><img src="png/graphite/C05-git-conflict.png" alt="石墨 · 合并冲突处理" loading="lazy"></a><figcaption><strong>C05 · 合并冲突处理</strong><p>当前版本、传入版本与结果区域；逐处解决后标记完成。</p></figcaption></figure><figure data-style="graphite" data-group="Git 工作流" hidden><a href="png/graphite/C06-git-discard.png" target="_blank"><img src="png/graphite/C06-git-discard.png" alt="石墨 · 放弃更改确认" loading="lazy"></a><figcaption><strong>C06 · 放弃更改确认</strong><p>明确受影响文件与操作后果，危险动作不设为默认聚焦按钮。</p></figcaption></figure><figure data-style="graphite" data-group="Git 工作流" hidden><a href="png/graphite/C07-git-error.png" target="_blank"><img src="png/graphite/C07-git-error.png" alt="石墨 · 同步失败与重试" loading="lazy"></a><figcaption><strong>C07 · 同步失败与重试</strong><p>保留当前更改，展示失败原因与可执行下一步；凭据从系统流程获取。</p></figcaption></figure><figure data-style="graphite" data-group="Git 工作流" hidden><a href="png/graphite/C08-git-split.png" target="_blank"><img src="png/graphite/C08-git-split.png" alt="石墨 · 并排差异" loading="lazy"></a><figcaption><strong>C08 · 并排差异</strong><p>前后版本并排；窄窗口自动使用行内差异，避免压缩代码到无法阅读。</p></figcaption></figure><figure data-style="graphite" data-group="AI 工作流" hidden><a href="png/graphite/D01-ai-empty.png" target="_blank"><img src="png/graphite/D01-ai-empty.png" alt="石墨 · AI 尚未连接" loading="lazy"></a><figcaption><strong>D01 · AI 尚未连接</strong><p>说明可接入能力，连接入口进入设置；不阻断文件或 Git 使用。</p></figcaption></figure><figure data-style="graphite" data-group="AI 工作流" hidden><a href="png/graphite/D02-ai-chat.png" target="_blank"><img src="png/graphite/D02-ai-chat.png" alt="石墨 · 按项目对话" loading="lazy"></a><figcaption><strong>D02 · 按项目对话</strong><p>当前项目、所选上下文、模型 n><strong>E02 · 插件中心 · 发现扩展</strong><p>固定入口；分类发现能力，区分已安装、已启用与按需运行。</p></figcaption></figure><figure data-style="graphite" data-group="插件中心" hidden><a href="png/graphite/E03-plugin-detail.png" target="_blank"><img src="png/graphite/E03-plugin-detail.png" alt="石墨 · 插件详情与贡献点" loading="lazy"></a><figcaption><strong>E03 · 插件详情与贡献点</strong><p>完整详情页展示来源、版本、权限、激活条件和界面贡献点。</p></figcaption></figure><figure data-style="graphite" data-group="插件中心" hidden><a href="png/graphite/E04-plugin-error.png" target="_blank"><img src="png/graphite/E04-plugin-error.png" alt="石墨 · 扩展失败与诊断" loading="lazy"></a><figcaption><strong>E04 · 扩展失败与诊断</strong><p>显示具体失败与日志，可重试或在当前项目停用。</p></figcaption></figure><figure data-style="graphite" data-group="插件中心" hidden><a href="png/graphite/E05-plugin-installed.png" target="_blank"><img src="png/graphite/E05-plugin-installed.png" alt="石墨 · 已安装与作用域" loading="lazy"></a><figcaption><strong>E05 · 已安装与作用域</strong><p>查看已安装扩展，按作用域筛选；启用、停用与配置就近操作。</p></figcaption></figure><figure data-style="graphite" data-group="插件中心" hidden><a href="png/graphite/E06-plugin-install.png" target="_blank"><img src="png/graphite/E06-plugin-install.png" alt="石墨 · 本地扩展包安装" loading="lazy"></a><figcaption><strong>E06 · 本地扩展包安装</strong><p>选择扩展包，查看来源、兼容性和安装后启用范围。</p></figcaption></figure><figure data-style="graphite" data-group="插件中心" hidden><a href="png/graphite/E07-plugin-installing.png" target="_blank"><img src="png/graphite/E07-plugin-installing.png" alt="石墨 · 安装进度与取消" loading="lazy"></a><figcaption><strong>E07 · 安装进度与取消</strong><p>检查、授权、安装与注册入口分步展示；取消不启用半成品。</p></figcaption></figure><figure data-style="graphite" data-group="插件中心" hidden><a href="png/graphite/E08-plugin-permissions.png" target="_blank"><img src="png/graphite/E08-plugin-permissions.png" alt="石墨 · 首次安装授权" loading="lazy"></a><figcaption><strong>E08 · 首次安装授权</strong><p>在所选范围内授予声明的能力；未同意时不能继续安装。</p></figcaption></figure><figure data-style="graphite" data-group="插件中心" hidden><a href="png/graphite/E09-plugin-settings.png" targ 06-narrow.png" target="_blank"><img src="png/graphite/G06-narrow.png" alt="石墨 · 窄窗口" loading="lazy"></a><figcaption><strong>G06 · 窄窗口</strong><p>侧栏变为可关闭浮层，AI 使用覆盖式面板；核心操作保留。</p></figcaption></figure><figure data-style="graphite" data-group="状态与适配" hidden><a href="png/graphite/G07-windows.png" target="_blank"><img src="png/graphite/G07-windows.png" alt="石墨 · Windows 窗口" loading="lazy"></a><figcaption><strong>G07 · Windows 窗口</strong><p>使用 Windows 窗口控制和 Ctrl 系快捷键，功能结构与 macOS 一致。</p></figcaption></figure><figure data-style="graphite" data-group="设计规范" hidden><a href="png/graphite/H01-architecture.png" target="_blank"><img src="png/graphite/H01-architecture.png" alt="石墨 · 信息架构" loading="lazy"></a><figcaption><strong>H01 · 信息架构</strong><p>工作区、项目、文件、工具与全局设置之间的关系。</p></figcaption></figure><figure data-style="graphite" data-group="设计规范" hidden><a href="png/graphite/H02-tokens.png" target="_blank"><img src="png/graphite/H02-tokens.png" alt="石墨 · 视觉令牌" loading="lazy"></a><figcaption><strong>H02 · 视觉令牌</strong><p>颜色、字体、间距、圆角、层级与图标规范。</p></figcaption></figure><figure data-style="graphite" data-group="设计规范" hidden><a href="png/graphite/H03-components.png" target="_blank"><img src="png/graphite/H03-components.png" alt="石墨 · 组件与反馈状态" loading="lazy"></a><figcaption><strong>H03 · 组件与反馈状态</strong><p>按钮、输入、开关、标签、菜单、通知及加载、禁用、错误状态。</p></figcaption></figure><figure data-style="graphite" data-group="设计规范" hidden><a href="png/graphite/H04-adaptive.png" target="_blank"><img src="png/graphite/H04-adaptive.png" alt="石墨 · 响应式布局规则" loading="lazy"></a><figcaption><strong>H04 · 响应式布局规则</strong><p>固定尺寸、可拖动边界、面板最小宽度与收起优先级。</p></figcaption></figure><figure data-style="graphite" data-group="设计规范" hidden><a href="png/graphite/H05-flows.png" target="_blank"><img src="png/graphite/H05-flows.png" alt="石墨 · 关键操作流程" loading="lazy"></a><figcaption><strong>H05 · 关键操作流程</strong><p>打开项目、审查改动、AI 协作、扩展启用四条主路径。</p></figcaption></figure><figure data-style="celadon" data-group="开始与项目" hidden><a href="png/celadon/A01-welcome.png" target="_blank"><img src="png/celadon/A01-welcome.png" alt="青瓷 · 首次打开" loading="lazy"></a><figcaption><strong>A01 · 首次打开</strong><p>无需登录，先打开本地项目；AI 与插件不进入首次启动必填流程。</p></figcaption></figure><figure data-style="celadon" data-group="开始与项目" hidden><a href="png/celadon/A02-projects.png" target="_blank"><img src="png/celadon/A02-projects.png" alt="青瓷 · 工作区与项目总览" loading="lazy"></a><figcaption><strong>A02 · 工作区与项目总览</strong><p>工作区分组、项目搜索、固定项目、最近访问与后台休眠状态。</p></figcaption></figure><figure data-style="celadon" data-group="开始与项目" hidden><a href="png/celadon/A03-workspace-create.png" target="_blank"><img src="png/celadon/A03-workspace-create.png" alt="青瓷 · 创建工作区" loading="lazy"></a><figcaption><strong>A03 · 创建工作区</strong><p>工作区是项目集合，创建不会搬动磁盘文件。</p></figcaption></figure><figure data-style="celadon" data-group="开始与项目" hidden><a href="png/celadon/A04-project-add.png" target="_blank"><img src="png/celadon/A04-project-add.png" alt="青瓷 · 添加本地项目" loading="lazy"></a><figcaption><strong>A04 · 添加本地项目</strong><p>选择目录、显示名与所属工作区；已有项目去重后直接打开。</p></figcaption></figure><figure data-style="celadon" data-group="开始与项目" hidden><a href="png/celadon/A05-clone.png" target="_blank"><img src="png/celadon/A05-clone.png" alt="青瓷 · 克隆仓库" loading="lazy"></a><figcaption><strong>A05 · 克隆仓库</strong><p>仓库地址、目标目录、克隆进度、取消与完成后的打开操作。</p></figcaption></figure><figure data-style="celadon" data-group="开始与项目" hidden><a href="png/celadon/A06-project-menu.png" target="_blank"><img src="png/celadon/A06-project-menu.png" alt="青瓷 · 项目操作菜单" loading="lazy"></a><figcaption><strong>A06 · 项目操作菜单</strong><p>固定、重命名显示名、在新窗口打开、休眠、从工作区移除；移除不删除磁盘文件。</p></figcaption></figure><figure data-style="celadon" data-group="阅读与编辑" hidden><a href="png/celadon/B01-home.png" target="_blank"><img src="png/celadon/B01-home.png" alt="青瓷 · 默认工作台" loading="lazy"></a><figcaption><strong>B01 · 默认工作台</strong><p>项目导航、文件树与代码区常驻；AI 和终端关闭；标签属于当前项目。</p></figcaption></figure><figure data-style="celadon" data-group="阅读与编辑" hidden><a href="png/celadon/B02-file-menu.png" target="_blank"><img src="png/celadon/B02-file-menu.png" alt="青瓷 · 文件操作" loading="lazy"></a><figcaption><strong>B02 · 文件操作</strong><p>新建文件或目录、重命名、复制路径、系统中显示与移到废纸篓。</p></figcaption></figure><figure data-style="celadon" data-group="阅读与编辑" hidden><a href="png/celadon/B03-quick-open.png" target="_blank"><img src="png/celadon/B03-quick-open.png" alt="青瓷 · 快速打开与命令" loading="lazy"></a><figcaption><strong>B03 · 快速打开与命令</strong><p>统一入口搜索文件，使用 > 进入命令；键盘导航并显示快捷键。</p></figcaption></figure><figure data-style="celadon" data-group="阅读与编辑" hidden><a href="png/celadon/B04-search.png" target="_blank"><img src="png/celadon/B04-search.png" alt="青瓷 · 项目内搜索" loading="lazy"></a><figcaption><strong>B04 · 项目内搜索</strong><p>按文件分组结果，显示匹配上下文；范围与大小写选项保留在搜索区域。</p></figcaption></figure><figure data-style="celadon" data-group="阅读与编辑" hidden><a href="png/celadon/B05-search-empty.png" target="_blank"><img src="png/celadon/B05-search-empty.png" alt="青瓷 · 搜索无结果" loading="lazy"></a><figcaption><strong>B05 · 搜索无结果</strong><p>保留查询，提供取消限制与修改搜索范围；不清空用户输入。</p></figcaption></figure><figure data-style="celadon" data-group="阅读与编辑" hidden><a href="png/celadon/B06-edit.png" target="_blank"><img src="png/celadon/B06-edit.png" alt="青瓷 · 轻量编辑与未保存" loading="lazy"></a><figcaption><strong>B06 · 轻量编辑与未保存</strong><p>未保存使用标签圆点；Git 修改使用 M。磁盘变化和未保存状态分别表达。</p></figcaption></figure><figure data-style="celadon" data-group="阅读与编辑" hidden><a href="png/celadon/B07-preview.png" target="_blank"><img src="png/celadon/B07-preview.png" alt="青瓷 · 分栏预览" loading="lazy"></a><figcaption><strong>B07 · 分栏预览</strong><p>Markdown 源码与预览并列；预览是可选插件，可单独关闭。</p></figcaption></figure><figure data-style="celadon" data-group="阅读与编辑" hidden><a href="png/celadon/B08-unsaved.png" target="_blank"><img src="png/celadon/B08-unsaved.png" alt="青瓷 · 关闭未保存文件" loading="lazy"></a><figcaption><strong>B08 · 关闭未保存文件</strong><p>保存、放弃本次编辑、取消；取消返回原上下文。</p></figcaption></figure><figure data-style="celadon" data-group="阅读与编辑" hidden><a href="png/celadon/B09-large-file.png" target="_blank"><img src="png/celadon/B09-large-file.png" alt="青瓷 · 大文件阅读" loading="lazy"></a><figcaption><strong>B09 · 大文件阅读</strong><p>显示文件大小与当前加载范围，允许继续加载或用系统应用打开。</p></figcaption></figure><figure data-style="celadon" data-group="阅读与编辑" hidden><a href="png/celadon/B10-outline.png" target="_blank"><img src="png/celadon/B10-outline.png" alt="青瓷 · 文件结构与符号" loading="lazy"></a><figcaption><strong>B10 · 文件结构与符号</strong><p>结构导航复用侧栏；基础标题结构可用，语义符号由语言插件提供。</p></figcaption></figure><figure data-style="celadon" data-group="Git 工作流" hidden><a href="png/celadon/C01-git-changes.png" target="_blank"><img src="png/celadon/C01-git-changes.png" alt="青瓷 · 更改与行内差异" loading="lazy"></a><figcaption><strong>C01 · 更改与行内差异</strong><p>未暂存与已暂存分组；点击不同组展示对应差异。</p></figcaption></figure><figure data-style="celadon" data-group="Git 工作流" hidden><a href="png/celadon/C02-git-commit.png" target="_blank"><img src="png/celadon/C02-git-commit.png" alt="青瓷 · 暂存与提交" loading="lazy"></a><figcaption><strong>C02 · 暂存与提交</strong><p>提交范围明确显示已暂存文件；提交信息为空或没有暂存时禁用提交。</p></figcaption></figure><figure data-style="celadon" data-group="Git 工作流" hidden><a href="png/celadon/C03-git-history.png" target="_blank"><img src="png/celadon/C03-git-history.png" alt="青瓷 · 提交历史" loading="lazy"></a><figcaption><strong>C03 · 提交历史</strong><p>紧凑历史列表与提交详情；按提交查看文件差异。</p></figcaption></figure><figure data-style="celadon" data-group="Git 工作流" hidden><a href="png/celadon/C04-git-branch.png" target="_blank"><img src="png/celadon/C04-git-branch.png" alt="青瓷 · 分支与远端同步" loading="lazy"></a><figcaption><strong>C04 · 分支与远端同步</strong><p>当前分支、搜索、新建分支、上游状态、拉取与推送。</p></figcaption></figure><figure data-style="celadon" data-group="Git 工作流" hidden><a href="png/celadon/C05-git-conflict.png" target="_blank"><img src="png/celadon/C05-git-conflict.png" alt="青瓷 · 合并冲突处理" loading="lazy"></a><figcaption><strong>C05 · 合并冲突处理</strong><p>当前版本、传入版本与结果区域；逐处解决后标记完成。</p></figcaption></figure><figure data-style="celadon" data-group="Git 工作流" hidden><a href="png/celadon/C06-git-discard.png" target="_blank"><img src="png/celadon/C06-git-discard.png" alt="青瓷 · 放弃更改确认" loading="lazy"></a><figcaption><strong>C06 · 放弃更改确认</strong><p>明确受影响文件与操作后果，危险动作不设为默认聚焦按钮。</p></figcaption></figure><figure data-style="celadon" data-group="Git 工作流" hidden><a href="png/celadon/C07-git-error.png" target="_blank"><img src="png/celadon/C07-git-error.png" alt="青瓷 · 同步失败与重试" loading="lazy"></a><figcaption><strong>C07 · 同步失败与重试</strong><p>保留当前更改，展示失败原因与可执行下一步；凭据从系统流程获取。</p></figcaption></figure><figure data-style="celadon" data-group="Git 工作流" hidden><a href="png/celadon/C08-git-split.png" target="_blank"><img src="png/celadon/C08-git-split.png" alt="青瓷 · 并排差异" loading="lazy"></a><figcaption><strong>C08 · 并排差异</strong><p>前后版本并排；窄窗口自动使用行内差异，避免压缩代码到无法阅读。</p></figcaption></figure><figure data-style="celadon" data-group="AI 工作流" hidden><a href="png/celadon/D01-ai-empty.png" target="_blank"><img src="png/celadon/D01-ai-empty.png" alt="青瓷 · AI 尚未连接" loading="lazy"></a><figcaption><strong>D01 · AI 尚未连接</strong><p>说明可接入能力，连接入口进入设置；不阻断文件或 Git 使用。</p></figcaption></figure><figure data-style="celadon" data-group="AI 工作流" hidden><a href="png/celadon/D02-ai-chat.png" target="_blank"><img src="png/celadon/D02-ai-chat.png" alt="青瓷 · 按项目对话" loading="lazy"></a><figcaption><strong>D02 · 按项目对话</strong><p>当前项目、所选上下文、模型与发送状态可见；聊天默认不执行写入。</p></figcaption></figure><figure data-style="celadon" data-group="AI 工作流" hidden><a href="png/celadon/D03-ai-context.png" target="_blank"><img src="png/celadon/D03-ai-context.png" alt="青瓷 · 上下文选择" loading="lazy"></a><figcaption><strong>D03 · 上下文选择</strong><p>显式选择文件、选区或 Git 差异，展示将发送的范围和移除入口。</p></figcaption></figure><figure data-style="celadon" data-group="AI 工作流" hidden><a href="png/celadon/D04-ai-running.png" target="_blank"><img src="png/celadon/D04-ai-running.png" alt="青瓷 · 任务执行中" loading="lazy"></a><figcaption><strong>D04 · 任务执行中</strong><p>任务模式单独启用；显示当前步骤、修改文件与停止操作。</p></figcaption></figure><figure data-style="celadon" data-group="AI 工作流" hidden><a href="png/celadon/D05-ai-permission.png" target="_blank"><img src="png/celadon/D05-ai-permission.png" alt="青瓷 · 待授权操作" loading="lazy"></a><figcaption><strong>D05 · 待授权操作</strong><p>命令、工作目录与本次影响明确列出；允许一次或拒绝，不默认永久放行。</p></figcaption></figure><figure data-style="celadon" data-group="AI 工作流" hidden><a href="png/celadon/D06-ai-review.png" target="_blank"><img src="png/celadon/D06-ai-review.png" alt="青瓷 · 审查 AI 修改" loading="lazy"></a><figcaption><strong>D06 · 审查 AI 修改</strong><p>文件列表与 diff 联动，可按文件接受或撤回；不自动提交 Git。</p></figcaption></figure><figure data-style="celadon" data-group="AI 工作流" hidden><a href="png/celadon/D07-ai-error.png" target="_blank"><img src="png/celadon/D07-ai-error.png" alt="青瓷 · 连接失败与重试" loading="lazy"></a><figcaption><strong>D07 · 连接失败与重试</strong><p>保留草稿与上下文；可重试、切换连接或打开连接设置。</p></figcaption></figure><figure data-style="celadon" data-group="终端" hidden><a href="png/celadon/E01-terminal.png" target="_blank"><img src="png/celadon/E01-terminal.png" alt="青瓷 · 按需终端" loading="lazy"></a><figcaption><strong>E01 · 按需终端</strong><p>底部终端绑定项目目录；关闭面板和结束进程是不同操作。</p></figcaption></figure><figure data-style="celadon" data-group="插件中心" hidden><a href="png/celadon/E02-plugins.png" target="_blank"><img src="png/celadon/E02-plugins.png" alt="青瓷 · 插件中心 · 发现扩展" loading="lazy"></a><figcaption><strong>E02 · 插件中心 · 发现扩展</strong><p>固定入口；分类发现能力，区分已安装、已启用与按需运行。</p></figcaption></figure><figure data-style="celadon" data-group="插件中心" hidden><a href="png/celadon/E03-plugin-detail.png" target="_blank"><img src="png/celadon/E03-plugin-detail.png" alt="青瓷 · 插件详情与贡献点" loading="lazy"></a><figcaption><strong>E03 · 插件详情与贡献点</strong><p>完整详情页展示来源、版本、权限、激活条件和界面贡献点。</p></figcaption></figure><figure data-style="celadon" data-group="插件中心" hidden><a href="png/celadon/E04-plugin-error.png" target="_blank"><img src="png/celadon/E04-plugin-error.png" alt="青瓷 · 扩展失败与诊断" loading="lazy"></a><figcaption><strong>E04 · 扩展失败与诊断</strong><p>显示具体失败与日志，可重试或在当前项目停用。</p></figcapti celadon" data-group="设置" hidden><a href="png/celadon/F09-settings-data.png" target="_blank"><img src="png/celadon/F09-settings-data.png" alt="青瓷 · 数据与隐私" loading="lazy"></a><figcaption><strong>F09 · 数据与隐私</strong><p>本地配置、凭据管理、日志与导出；导出默认不包含密钥。</p></figcaption></figure><figure data-style="celadon" data-group="设置" hidden><a href="png/celadon/F10-settings-sizes.png" target="_blank"><img src="png/celadon/F10-settings-sizes.png" alt="青瓷 · 区域尺寸" loading="lazy"></a><figcaption><strong>F10 · 区域尺寸</strong><p>侧栏、顶部、文件页签、辅助与底部面板分别调整；保存首选值，窄窗口临时适配。</p></figcaption></figure><figure data-style="celadon" data-group="设置" hidden><a href="png/celadon/F11-settings-background.png" target="_blank"><img src="png/celadon/F11-settings-background.png" alt="青瓷 · 背景图片" loading="lazy"></a><figcaption><strong>F11 · 背景图片</strong><p>上传本地静态图片，设置显示区域、适应方式、可见度和表面遮罩。</p></figcaption></figure><figure data-style="celadon" data-group="设置" hidden><a href="png/celadon/F12-settings-colors.png" target="_blank"><img src="png/celadon/F12-settings-colors.png" alt="青瓷 · 自定义配色" loading="lazy"></a><figcaption><strong>F12 · 自定义配色</strong><p>浅深模式分别覆盖语义色；主题与布局独立，提供对比度提示和单项恢复。</p></figcaption></figure><figure data-style="celadon" data-group="设置" hidden><a href="png/celadon/F13-settings-presets.png" target="_blank"><img src="png/celadon/F13-settings-presets.png" alt="青瓷 · 外观组合" loading="lazy"></a><figcaption><strong>F13 · 外观组合</strong><p>保存、应用、导入导出自己的布局、主题、尺寸和背景组合。</p></figcaption></figure><figure data-style="celadon" data-group="设置" hidden><a href="png/celadon/F14-settings-layout-recovery.png" target="_blank"><img src="png/celadon/F14-settings-layout-recovery.png" alt="青瓷 · 布局恢复" loading="lazy"></a><figcaption><strong>F14 · 布局恢复</strong><p>布局启用失败保留上次有效布局、未保存内容和任务，可进入插件管理恢复。</p></figcaption></figure><figure data-style="celadon" data-group="状态与适配" hidden><a href="png/celadon/G01-loading.png" target="_blank"><img src="png/celadon/G01-loading.png" alt="青瓷 · 工作区加载中" loading="lazy"></a><figcaption><strong>G01 · 工作区加载中</strong><p>先显示窗口和项目结构；局部渐进加载，取消操作始终可用。</p></figcaption></figure><figure data-style="celadon" data-group="状态与适配" hidden><a href="png/celadon/G02-file-error.png" target="_blank"><img src="png/celadon/G02-file-error.png" alt="青瓷 · 文件不可用" loading="lazy"></a><figcaption><strong>G02 · 文件不可用</strong><p>区分权限不足与路径失效，提供重试、重新定位和关闭标签。</p></figcaption></figure><figure data-style="celadon" data-group="状态与适配" hidden><a href="png/celadon/G03-sleep.png" target="_blank"><img src="png/celadon/G03-sleep.png" alt="青瓷 · 后台项目休眠" loading="lazy"></a><figcaption><strong>G03 · 后台项目休眠</strong><p>保留会话与未保存文档，停止可恢复的后台服务；切回时恢复。</p></figcaption></figure><figure data-style="celadon" data-group="状态与适配" hidden><a href="png/celadon/G04-focus.png" target="_blank"><img src="png/celadon/G04-focus.png" alt="青瓷 · 专注模式" loading="lazy"></a><figcaption><strong>G04 · 专注模式</strong><p>一次收起辅助区域，退出后恢复原布局。</p></figcaption></figure><figure data-style="celadon" data-group="状态与适配" hidden><a href="png/celadon/G05-dark.png" target="_blank"><img src="png/celadon/G05-dark.png" alt="青瓷 · 深色主题" loading="lazy"></a><figcaption><strong>G05 · 深色主题</strong><p>保持语义色、层级与对比度；不通过简单反色生成。</p></figcaption></figure><figure data-style="celadon" data-group="状态与适配" hidden><a href="png/celadon/G06-narrow.png" target="_blank"><img src="png/celadon/G06-narrow.png" alt="青瓷 · 窄窗口" loading="lazy"></a><figcaption><strong>G06 · 窄窗口</strong><p>侧栏变为可关闭浮层，AI 使用覆盖式面板；核心操作保留。</p></figcaption></figure><figure data-style="celadon" data-group="状态与适配" hidden><a href="png/celadon/G07-windows.png" target="_blank"><img src="png/celadon/G07-windows.png" alt="青瓷 · Windows 窗口" loading="lazy"></a><figcaption><strong>G07 · Windows 窗口</strong><p>使用 Windows 窗口控制和 Ctrl 系快捷键，功能结构与 macOS 一致。</p></figcaption></figure><figure data-style="celadon" data-group="设计规范" hidden><a href="png/celadon/H01-architecture.png" target="_blank"><img src="png/celadon/H01-architecture.png" alt="青瓷 · 信息架构" loading="lazy"></a><figcaption><strong>H01 · 信息架构</strong><p>工作区、项目、文件、工具与全局设置之间的关系。</p></figcaption></figure><figure data-style="celadon" data-group="设计规范" hidden><a href="png/celadon/H02-tokens.png" target="_blank"><img src="png/celadon/H02-tokens.png" alt="青瓷 · 视觉令牌" loading="lazy"></a><figcaption><strong>H02 · 视觉令牌</strong><p>颜色、字体、间距、圆角、层级与图标规范。</p></figcaption></figure><figure data-style="celadon" data-group="设计规范" hidden><a href="png/celadon/H03-components.png" target="_blank"><img src="png/celadon/H03-components.png" alt="青瓷 · 组件与反馈状态" loading="lazy"></a><figcaption><strong>H03 · 组件与反馈状态</strong><p>按钮、输入、开关、标签、菜单、通知及加载、禁用、错误状态。</p></figcaption></figure><figure data-style="celadon" data-group="设计规范" hidden><a href="png/celadon/H04-adaptive.png" target="_blank"><img src="png/celadon/H04-adaptive.png" alt="青瓷 · 响应式布局规则" loading="lazy"></a><figcaption><strong>H04 · 响应式布局规则</strong><p>固定尺寸、可拖动边界、面板最小宽度与收起优先级。</p></figcaption></figure><figure data-style="celadon" data-group="设计规范" hidden><a href="png/celadon/H05-flows.png" target="_blank"><img src="png/celadon/H05-flows.png" alt="青瓷 · 关键操作流程" loading="lazy"></a><figcaption><strong>H05 · 关键操作流程</strong><p>打开项目、审查改动、AI 协作、扩展启用四条主路径。</p></figcaption></figure><figure data-style="iris" data-group="开始与项目" hidden><a href="png/iris/A01-welcome.png" target="_blank"><img src="png/iris/A01-welcome.png" alt="鸢尾 · 首次打开" loading="lazy"></a><figcaption><strong>A01 · 首次打开</strong><p>无需登录，先打开本地项目；AI 与插件不进入首次启动必填流程。</p></figcaption></figure><figure data-style="iris" data-group="开始与项目" hidden><a href="png/iris/A02-projects.png" target="_blank"><img src="png/iris/A02-projects.png" alt="鸢尾 · 工作区与项目总览" loading="lazy"></a><figcaption><strong>A02 · 工作区与项目总览</strong><p>工作区分组、项目搜索、固定项目、最近访问与后台休眠状态。</p></figcaption></figure><figure data-style="iris" data-group="开始与项目" hidden><a href="png/iris/A03-workspace-create.png" target="_blank"><img src="png/iris/A03-workspace-create.png" alt="鸢尾 · 创建工作区" loading="lazy"></a><figcaption><strong>A03 · 创建工作区</strong><p>工作区是项目集合，创建不会搬动磁盘文件。</p></figcaption></figure><figure data-style="iris" data-group="开始与项目" hidden><a href="png/iris/A04-project-add.png" target="_blank"><img src="png/iris/A04-project-add.png" alt="鸢尾 · 添加本地项目" loading="lazy"></a><figcaption><strong>A04 · 添加本地项目</strong><p>选择目录、显示名与所属工作区；已有项目去重后直接打开。</p></figcaption></figure><figure data-style="iris" data-group="开始与项目" hidden><a href="png/iris/A05-clone.png" target="_blank"><img src="png/iris/A05-clone.png" alt="鸢尾 · 克隆仓库" loading="lazy"></a><figcaption><strong>A05 · 克隆仓库</strong><p>仓库地址、目标目录、克隆进度、取消与完成后的打开操作。</p></figcaption></figure><figure data-style="iris" data-group="开始与项目" hidden><a href="png/iris/A06-project-menu.png" target="_blank"><img src="png/iris/A06-project-menu.png" alt="鸢尾 · 项目操作菜单" loading="lazy"></a><figcaption><strong>A06 · 项目操作菜单</strong><p>固定、重命名显示名、在新窗口打开、休眠、从工作区移除；移除不删除磁盘文件。</p></figcaption></figure><figure data-style="iris" data-group="阅读与编辑" hidden><a href="png/iris/B01-home.png" target="_blank"><img src="png/iris/B01-home.png" alt="鸢尾 · 默认工作台" loading="lazy"></a><figcaption><strong>B01 · 默认工作台</strong><p>项目导航、文件树与代码区常驻；AI 和终端关闭；标签属于当前项目。</p></figcaption></figure><figure data-style="iris" data-group="阅读与编辑" hidden><a href="png/iris/B02-file-menu.png" target="_blank"><img src="png/iris/B02-file-menu.png" alt="鸢尾 · 文件操作" loading="lazy"></a><figcaption><strong>B02 · 文件操作</strong><p>新建文件或目录、重命名、复制路径、系统中显示与移到废纸篓。</p></figcaption></figure><figure data-style="iris" data-group="阅读与编辑" hidden><a href="png/iris/B03-quick-open.png" target="_blank"><img src="png/iris/B03-quick-open.png" alt="鸢尾 · 快速打开与命令" loading="lazy"></a><figcaption><strong>B03 · 快速打开与命令</strong><p>统一入口搜索文件，使用 > 进入命令；键盘导航并显示快捷键。</p></figcaption></figure><figure data-style="iris" data-group="阅读与编辑" hidden><a href="png/iris/B04-search.png" target="_blank"><img src="png/iris/B04-search.png" alt="鸢尾 · 项目内搜索" loading="lazy"></a><figcaption><strong>B04 · 项目内搜索</strong><p>按文件分组结果，显示匹配上下文；范围与大小写选项保留在搜索区域。</p></figcaption></figure><figure data-style="iris" data-group="阅读与编辑" hidden><a href="png/iris/B05-search-empty.png" target="_blank"><img src="png/iris/B05-search-empty.png" alt="鸢尾 · 搜索无结果" loading="lazy"></a><figcaption><strong>B05 · 搜索无结果</strong><p>保留查询，提供取消限制与修改搜索范围；不清空用户输入。</p></figcaption></figure><figure data-style="iris" data-group="阅读与编辑" hidden><a href="png/iris/B06-edit.png" target="_blank"><img src="png/iris/B06-edit.png" alt="鸢尾 · 轻量编辑与未保存" loading="lazy"></a><figcaption><strong>B06 · 轻量编辑与未保存</strong><p>未保存使用标签圆点；Git 修改使用 M。磁盘变化和未保存状态分别表达。</p></figcaption></figure><figure data-style="iris" data-group="阅读与编辑" hidden><a href="png/iris/B07-preview.png" target="_blank"><img src="png/iris/B07-preview.png" alt="鸢尾 · 分栏预览" loading="lazy"></a><figcaption><strong>B07 · 分栏预览</strong><p>Markdown 源码与预览并列；预览是可选插件，可单独关闭。</p></figcaption></figure><figure data-style="iris" data-group="阅读与编辑" hidden><a href="png/iris/B08-unsaved.png" target="_blank"><img src="png/iris/B08-unsaved.png" alt="鸢尾 · 关闭未保存文件" loading="lazy"></a><figcaption><strong>B08 · 关闭未保存文件</strong><p>保存、放弃本次编辑、取消；取消返回原上下文。</p></figcaption></figure><figure data-style="iris" data-group="阅读与编辑" hidden><a href="png/iris/B09-large-file.png" target="_blank"><img src="png/iris/B09-large-file.png" alt="鸢尾 · 大文件阅读" loading="lazy"></a><figcaption><strong>B09 · 大文件阅读</strong><p>显示文件大小与当前加载范围，允许继续加载或用系统应用打开。</p></figcaption></figure><figure data-style="iris" data-group="阅读与编辑" hidden><a href="png/iris/B10-outline.png" target="_blank"><img src="png/iris/B10-outline.png" alt="鸢尾 · 文件结构与符号" loading="lazy"></a><figcaption><strong>B10 · 文件结构与符号</strong><p>结构导航复用侧栏；基础标题结构可用，语义符号由语言插件提供。</p></figcaption></figure><figure data-style="iris" data-group="Git 工作流" hidden><a href="png/iris/C01-git-changes.png" target="_blank"><img src="png/iris/C01-git-changes.png" alt="鸢尾 · 更改与行内差异" loading="lazy"></a><figcaption><strong>C01 · 更改与行内差异</strong><p>未暂存与已暂存分组；点击不同组展示对应差异。</p></figcaption></figure><figure data-style="iris" data-group="Git 工作流" hidden><a href="png/iris/C02-git-commit.png" target="_blank"><img src="png/iris/C02-git-commit.png" alt="鸢尾 · 暂存与提交" loading="lazy"></a><figcaption><strong>C02 · 暂存与提交</strong><p>提交范围明确显示已暂存文件；提交信息为空或没有暂存时禁用提交。</p></figcaption></figure><figure data-style="iris" data-group="Git 工作流" hidden><a href="png/iris/C03-git-history.png" target="_blank"><img src="png/iris/C03-git-history.png" alt="鸢尾 · 提交历史" loading="lazy"></a><figcaption><strong>C03 · 提交历史</strong><p>紧凑历史列表与提交详情；按提交查看文件差异。</p></figcaption></figure><figure data-style="iris" data-group="Git 工作流" hidden><a href="png/iris/C04-git-branch.png" target="_blank"><img src="png/iris/C04-git-branch.png" alt="鸢尾 · 分支与远端同步" loading="lazy"></a><figcaption><strong>C04 · 分支与远端同步</strong><p>当前分支、搜索、新建分支、上游状态、拉取与推送。</p></figcaption></figure><figure data-style="iris" data-group="Git 工作流" hidden><a href="png/iris/C05-git-conflict.png" target="_blank"><img src="png/iris/C05-git-conflict.png" alt="鸢尾 · 合并冲突处理" loading="lazy"></a><figcaption><strong>C05 · 合并冲突处理</strong><p>当前版本、传入版本与结果区域；逐处解决后标记完成。</p></figcaption></figure><figure data-style="iris" data-group="Git 工作流" hidden><a href="png/iris/C06-git-discard.png" target="_blank"><img src="png/iris/C06-git-discard.png" alt="鸢尾 · 放弃更改确认" loading="lazy"></a><figcaption><strong>C06 · 放弃更改确认</strong><p>明确受影响文件与操作后果，危险动作不设为默认聚焦按钮。</p></figcaption></figure><figure data-style="iris" data-group="Git 工作流" hidden><a href="png/iris/C07-git-error.png" target="_blank"><img src="png/iris/C07-git-error.png" alt="鸢尾 · 同步失败与重试" loading="lazy"></a><figcaption><strong>C07 · 同步失败与重试</strong><p>保留当前更改，展示失败原因与可执行下一步；凭据从系统流程获取。</p></figcaption></figure><figure data-style="iris" data-group="Git 工作流" hidden><a href="png/iris/C08-git-split.png" target="_blank"><img src="png/iris/C08-git-split.png" alt="鸢尾 · 并排差异" loading="lazy"></a><figcaption><strong>C08 · 并排差异</strong><p>前后版本并排；窄窗口自动使用行内差异，避免压缩代码到无法阅读。</p></figcaption></figure><figure data-style="iris" data-group="AI 工作流" hidden><a href="png/iris/D01-ai-empty.png" target="_blank"><img src="png/iris/D01-ai-empty.png" alt="鸢尾 · AI 尚未连接" loading="lazy"></a><figcaption><strong>D01 · AI 尚未连接</strong><p>说明可接入能力，连接入口进入设置；不阻断文件或 Git 使用。</p></figcaption></figure><figure data-style="iris" data-group="AI 工作流" hidden><a href="png/iris/D02-ai-chat.png" target="_blank"><img src="png/iris/D02-ai-chat.png" alt="鸢尾 · 按项目对话" loading="lazy"></a><figcaption><strong>D02 · 按项目对话</strong><p>当前项目、所选上下文、模型与发送状态可见；聊天默认不执行写入。</p></figcaption></figure><figure data-style="iris" data-group="AI 工作流" hidden><a href="png/iris/D03-ai-context.png" target="_blank"><img src="png/iris/D03-ai-context.png" alt="鸢尾 · 上下文选择" loading="lazy"></a><figcaption><strong>D03 · 上下文选择</strong><p>显式选择文件、选区或 Git 差异，展示将发送的范围和移除入口。</p></figcaption></figure><figure data-style="iris" data-group="AI 工作流" hidden><a href="png/iris/D04-ai-running.png" target="_blank"><img src="png/iris/D04-ai-running.png" alt="鸢尾 · 任务执行中" loading="lazy"></a><figcaption><strong>D04 · 任务执行中</strong><p>任务模式单独启用；显示当前步骤、修改文件与停止操作。</p></figcaption></figure><figure data-style="iris" data-group="AI 工作流" hidden><a href="png/iris/D05-ai-permission.png" target="_blank"><img src="png/iris/D05-ai-permission.png" alt="鸢尾 · 待授权操作" loading="lazy"></a><figcaption><strong>D05 · 待授权操作</strong><p>命令、工作目录与本次影响明确列出；允许一次或拒绝，不默认永久放行。</p></figcaption></figure><figure data-style="iris" data-group="AI 工作流" hidden><a href="png/iris/D06-ai-review.png" target="_blank"><img src="png/iris/D06-ai-review.png" alt="鸢尾 · 审查 AI 修改" loading="lazy"></a><figcaption><strong>D06 · 审查 AI 修改</strong><p>文件列表与 diff 联动，可按文件接受或撤回；不自动提交 Git。</p></figcaption></figure><figure data-style="iris" data-group="AI 工作流" hidden><a href="png/iris/D07-ai-error.png" target="_blank"><img src="png/iris/D07-ai-error.png" alt="鸢尾 · 连接失败与重试" loading="lazy"></a><figcaption><strong>D07 · 连接失败与重试</strong><p>保留草稿与上下文；可重试、切换连接或打开连接设置。</p></figcaption></figure><figure data-style="iris" data-group="终端" hidden><a href="png/iris/E01-terminal.png" target="_blank"><img src="png/iris/E01-terminal.png" alt="鸢尾 · 按需终端" loading="lazy"></a><figcaption><strong>E01 · 按需终端< .png" alt="鸢尾 · 外观组合" loading="lazy"></a><figcaption><strong>F13 · 外观组合</strong><p>保存、应用、导入导出自己的布局、主题、尺寸和背景组合。</p></figcaption></figure><figure data-style="iris" data-group="设置" hidden><a href="png/iris/F14-settings-layout-recovery.png" target="_blank"><img src="png/iris/F14-settings-layout-recovery.png" alt="鸢尾 · 布局恢复" loading="lazy"></a><figcaption><strong>F14 · 布局恢复</strong><p>布局启用失败保留上次有效布局、未保存内容和任务，可进入插件管理恢复。</p></figcaption></figure><figure data-style="iris" data-group="状态与适配" hidden><a href="png/iris/G01-loading.png" target="_blank"><img src="png/iris/G01-loading.png" alt="鸢尾 · 工作区加载中" loading="lazy"></a><figcaption><strong>G01 · 工作区加载中</strong><p>先显示窗口和项目结构；局部渐进加载，取消操作始终可用。</p></figcaption></figure><figure data-style="iris" data-group="状态与适配" hidden><a href="png/iris/G02-file-error.png" target="_blank"><img src="png/iris/G02-file-error.png" alt="鸢尾 · 文件不可用" loading="lazy"></a><figcaption><strong>G02 · 文件不可用</strong><p>区分权限不足与路径失效，提供重试、重新定位和关闭标签。</p></figcaption></figure><figure data-style="iris" data-group="状态与适配" hidden><a href="png/iris/G03-sleep.png" target="_blank"><img src="png/iris/G03-sleep.png" alt="鸢尾 · 后台项目休眠" loading="lazy"></a><figcaption><strong>G03 · 后台项目休眠</strong><p>保留会话与未保存文档，停止可恢复的后台服务；切回时恢复。</p></figcaption></figure><figure data-style="iris" data-group="状态与适配" hidden><a href="png/iris/G04-focus.png" target="_blank"><img src="png/iris/G04-focus.png" alt="鸢尾 · 专注模式" loading="lazy"></a><figcaption><strong>G04 · 专注模式</strong><p>一次收起辅助区域，退出后恢复原布局。</p></figcaption></figure><figure data-style="iris" data-group="状态与适配" hidden><a href="png/iris/G05-dark.png" target="_blank"><img src="png/iris/G05-dark.png" alt="鸢尾 · 深色主题" loading="lazy"></a><figcaption><strong>G05 · 深色主题</strong><p>保持语义色、层级与对比度；不通过简单反色生成。</p></figcaption></figure><figure data-style="iris" data-group="状态与适配" hidden><a href="png/iris/G06-narrow.png" target="_blank"><img src="png/iris/G06-narrow.png" alt="鸢尾 · 窄窗口" loading="lazy"></a><figcaption><strong>G06 · 窄窗口</strong><p>侧栏变为可关闭浮层，AI 使用覆盖式面板；核心操作保留。</p></figcaption></figure><figure data-style="iris" data-group="状态与适配" hidden><a href="png/iris/G07-windows.png" target="_blank"><img src="png/iris/G07-windows.png" alt="鸢尾 · Windows 窗口" loading="lazy"></a><figcaption><strong>G07 · Windows 窗口</strong><p>使用 Windows 窗口控制和 Ctrl 系快捷键，功能结构与 macOS 一致。</p></figcaption></figure><figure data-style="iris" data-group="设计规范" hidden><a href="png/iris/H01-architecture.png" target="_blank"><img src="png/iris/H01-architecture.png" alt="鸢尾 · 信息架构" loading="lazy"></a><figcaption><strong>H01 · 信息架构</strong><p>工作区、项目、文件、工具与全局设置之间的关系。</p></figcaption></figure><figure data-style="iris" data-group="设计规范" hidden><a href="png/iris/H02-tokens.png" target="_blank"><img src="png/iris/H02-tokens.png" alt="鸢尾 · 视觉令牌" loading="lazy"></a><figcaption><strong>H02 · 视觉令牌</strong><p>颜色、字体、间距、圆角、层级与图标规范。</p></figcaption></figure><figure data-style="iris" data-group="设计规范" hidden><a href="png/iris/H03-components.png" target="_blank"><img src="png/iris/H03-components.png" alt="鸢尾 · 组件与反馈状态" loading="lazy"></a><figcaption><strong>H03 · 组件与反馈状态</strong><p>按钮、输入、开关、标签、菜单、通知及加载、禁用、错误状态。</p></figcaption></figure><figure data-style="iris" data-group="设计规范" hidden><a href="png/iris/H04-adaptive.png" target="_blank"><img src="png/iris/H04-adaptive.png" alt="鸢尾 · 响应式布局规则" loading="lazy"></a><figcaption><strong>H04 · 响应式布局规则</strong><p>固定尺寸、可拖动边界、面板最小宽度与收起优先级。</p></figcaption></figure><figure data-style="iris" data-group="设计规范" hidden><a href="png/iris/H05-flows.png" target="_blank"><img src="png/iris/H05-flows.png" alt="鸢尾 · 关键操作流程" loading="lazy"></a><figcaption><strong>H05 · 关键操作流程</strong><p>打开项目、审查改动、AI 协作、扩展启用四条主路径。</p></figcaption></figure><figure data-style="sand" data-group="开始与项目" hidden><a href="png/sand/A01-welcome.png" target="_blank"><img src="png/sand/A01-welcome.png" alt="砂岩 · 首次打开" loading="lazy"></a><figcaption><strong>A01 · 首次打开</strong><p>无需登录，先打开本地项目；AI 与插件不进入首次启动必填流程。</p></figcaption></figure><figure data-style="sand" data-group="开始与项目" hidden><a href="png/sand/A02-projects.png" target="_blank"><img src="png/sand/A02-projects.png" alt="砂岩 · 工作区与项目总览" loading="lazy"></a><figcaption><strong>A02 · 工作区与项目总览</strong><p>工作区分组、项目搜索、固定项目、最近访问与后台休眠状态。</p></figcaption></figure><figure data-style="sand" data-group="开始与项目" hidden><a href="png/sand/A03-workspace-create.png" target="_blank"><img src="png/sand/A03-workspace-create.png" alt="砂岩 · 创建工作区" loading="lazy"></a><figcaption><strong>A03 · 创建工作区</strong><p>工作区是项目集合，创建不会搬动磁盘文件。</p></figcaption></figure><figure data-style="sand" data-group="开始与项目" hidden><a href="png/sand/A04-project-add.png" target="_blank"><img src="png/sand/A04-project-add.png" alt="砂岩 · 添加本地项目" loading="lazy"></a><figcaption><strong>A04 · 添加本地项目</strong><p>选择目录、显示名与所属工作区；已有项目去重后直接打开。</p></figcaption></figure><figure data-style="sand" data-group="开始与项目" hidden><a href="png/sand/A05-clone.png" target="_blank"><img src="png/sand/A05-clone.png" alt="砂岩 · 克隆仓库" loading="lazy"></a><figcaption><strong>A05 · 克隆仓库</strong><p>仓库地址、目标目录、克隆进度、取消与完成后的打开操作。</p></figcaption></figure><figure data-style="sand" data-group="开始与项目" hidden><a href="png/sand/A06-project-menu.png" target="_blank"><img src="png/sand/A06-project-menu.png" alt="砂岩 · 项目操作菜单" loading="lazy"></a><figcaption><strong>A06 · 项目操作菜单</strong><p>固定、重命名显示名、在新窗口打开、休眠、从工作区移除；移除不删除磁盘文件。</p></figcaption></figure><figure data-style="sand" data-group="阅读与编辑" hidden><a href="png/sand/B01-home.png" target="_blank"><img src="png/sand/B01-home.png" alt="砂岩 · 默认工作台" loading="lazy"></a><figcaption><strong>B01 · 默认工作台</strong><p>项目导航、文件树与代码区常驻；AI 和终端关闭；标签属于当前项目。</p></figcaption></figure><figure data-style="sand" data-group="阅读与编辑" hidden><a href="png/sand/B02-file-menu.png" target="_blank"><img src="png/sand/B02-file-menu.png" alt="砂岩 · 文件操作" loading="lazy"></a><figcaption><strong>B02 · 文件操作</strong><p>新建文件或目录、重命名、复制路径、系统中显示与移到废纸篓。</p></figcaption></figure><figure data-style="sand" data-group="阅读与编辑" hidden><a href="png/sand/B03-quick-open.png" target="_blank"><img src="png/sand/B03-quick-open.png" alt="砂岩 · 快速打开与命令" loading="lazy"></a><figcaption><strong>B03 · 快速打开与命令</strong><p>统一入口搜索文件，使用 > 进入命令；键盘导航并显示快捷键。</p></figcaption></figure><figure data-style="sand" data-group="阅读与编辑" hidden><a href="png/sand/B04-search.png" target="_blank"><img src="png/sand/B04-search.png" alt="砂岩 · 项目内搜索" loading="lazy"></a><figcaption><strong>B04 · 项目内搜索</strong><p>按文件分组结果，显示匹配上下文；范围与大小写选项保留在搜索区域。</p></figcaption></figure><figure data-style="sand" data-group="阅读与编辑" hidden><a href="png/sand/B05-search-empty.png" target="_blank"><img src="png/sand/B05-search-empty.png" alt="砂岩 · 搜索无结果" loading="lazy"></a><figcaption><strong>B05 · 搜索无结果</strong><p>保留查询，提供取消限制与修改搜索范围；不清空用户输入。</p></figcaption></figure><figure data-style="sand" data-group="阅读与编辑" hidden><a href="png/sand/B06-edit.png" target="_blank"><img src="png/sand/B06-edit.png" alt="砂岩 · 轻量编辑与未保存" loading="lazy"></a><figcaption><strong>B06 · 轻量编辑与未保存</strong><p>未保存使用标签圆点；Git 修改使用 M。磁盘变化和未保存状态分别表达。</p></figcaption></figure><figure data-style="sand" data-group="阅读与编辑" hidden><a href="png/sand/B07-preview.png" target="_blank"><img src="png/sand/B07-preview.png" alt="砂岩 · 分栏预览" loading="lazy"></a><figcaption><strong>B07 · 分栏预览</strong><p>Markdown 源码与预览并列；预览是可选插件，可单独关闭。</p></figcaption></figure><figure data-style="sand" data-group="阅读与编辑" hidden><a href="png/sand/B08-unsaved.png" target="_blank"><img src="png/sand/B08-unsaved.png" alt="砂岩 · 关闭未保存文件" loading="lazy"></a><figcaption><strong>B08 · 关闭未保存文件</strong><p>保存、放弃本次编辑、取消；取消返回原上下文。</p></figcaption></figure><figure data-style="sand" data-group="阅读与编辑" hidden><a href="png/sand/B09-large-file.png" target="_blank"><img src="png/sand/B09-large-file.png" alt="砂岩 · 大文件阅读" loading="lazy"></a><figcaption><strong>B09 · 大文件阅读</strong><p>显示文件大小与当前加载范围，允许继续加载或用系统应用打开。</p></figcaption></figure><figure data-style="sand" data-group="阅读与编辑" hidden><a href="png/sand/B10-outline.png" target="_blank"><img src="png/sand/B10-outline.png" alt=" ></a><figcaption><strong>F01 · 外观设置</strong><p>布局、主题、尺寸、背景与自定义颜色分别选择，支持全局默认和项目覆盖。</p></figcaption></figure><figure data-style="aurora" data-group="设置" hidden><a href="png/aurora/F02-settings-layout.png" target="_blank"><img src="png/aurora/F02-settings-layout.png" alt="极光 · 布局插件" loading="lazy"></a><figcaption><strong>F02 · 布局插件</strong><p>八个预装布局均为插件；选择结构不改变主题、文档与任务。</p></figcaption></figure><figure data-style="aurora" data-group="设置" hidden><a href="png/aurora/F03-settings-editor.png" target="_blank"><img src="png/aurora/F03-settings-editor.png" alt="极光 · 编辑器偏好" loading="lazy"></a><figcaption><strong>F03 · 编辑器偏好</strong><p>字体、字号、缩进、换行、自动保存与可选语言服务。</p></figcaption></figure><figure data-style="aurora" data-group="设置" hidden><a href="png/aurora/F04-settings-projects.png" target="_blank"><img src="png/aurora/F04-settings-projects.png" alt="极光 · 项目与资源" loading="lazy"></a><figcaption><strong>F04 · 项目与资源</strong><p>会话恢复、后台休眠与缓存策略；显示状态，不填入未经测量的性能数字。</p></figcaption></figure><figure data-style="aurora" data-group="设置" hidden><a href="png/aurora/F05-settings-ai.png" target="_blank"><img src="png/aurora/F05-settings-ai.png" alt="极光 · AI 连接管理" loading="lazy"></a><figcaption><strong>F05 · AI 连接管理</strong><p>管理兼容 API、本地模型与 Agent 连接，设置全局默认和项目覆盖。</p></figcaption></figure><figure data-style="aurora" data-group="设置" hidden><a href="png/aurora/F06-settings-ai-add.png" target="_blank"><img src="png/aurora/F06-settings-ai-add.png" alt="极光 · 新增 AI 连接" loading="lazy"></a><figcaption><strong>F06 · 新增 AI 连接</strong><p>名称、类型、地址、模型、凭据与测试连接；凭据交给系统安全存储。</p></figcaption></figure><figure data-style="aurora" data-group="设置" hidden><a href="png/aurora/F07-settings-git.png" target="_blank"><img src="png/aurora/F07-settings-git.png" alt="极光 · Git 偏好" loading="lazy"></a><figcaption><strong>F07 · Git 偏好</strong><p>Git 可用状态、自动刷新与差异形式；提交身份沿用仓库配置。</p></figcaption></figure><figure data-style="aurora" data-group="设置" hidden><a href="png/aurora/F08-settings-keys.png" target="_blank"><img src="png/aurora/F08-settings-keys.png" alt="极光 · 快捷键" loading="lazy"></a><figcaption><strong>F08 · 快捷键</strong><p>按操作查找、录入新键位，发现冲突时提供替换或取消。</p></figcaption></figure><figure data-style="aurora" data-group="设置" hidden><a href="png/aurora/F09-settings-data.png" target="_blank"><img src="png/aurora/F09-settings-data.png" alt="极光 · 数据与隐私" loading="lazy"></a><figcaption><strong>F09 · 数据与隐私</strong><p>本地配置、凭据管理、日志与导出；导出默认不包含密钥。</p></figcaption></figure><figure data-style="aurora" data-group="设置" hidden><a href="png/aurora/F10-settings-sizes.png" target="_blank"><img src="png/aurora/F10-settings-sizes.png" alt="极光 · 区域尺寸" loading="lazy"></a><figcaption><strong>F10 · 区域尺寸</strong><p>侧栏、顶部、文件页签、辅助与底部面板分别调整；保存首选值，窄窗口临时适配。</p></figcaption></figure><figure data-style="aurora" data-group="设置" hidden><a href="png/aurora/F11-settings-background.png" target="_blank"><img src="png/aurora/F11-settings-background.png" alt="极光 · 背景图片" loading="lazy"></a><figcaption><strong>F11 · 背景图片</strong><p>上传本地静态图片，设置显示区域、适应方式、可见度和表面遮罩。</p></figcaption></figure><figure data-style="aurora" data-group="设置" hidden><a href="png/aurora/F12-settings-colors.png" target="_blank"><img src="png/aurora/F12-settings-colors.png" alt="极光 · 自定义配色" loading="lazy"></a><figcaption><strong>F12 · 自定义配色</strong><p>浅深模式分别覆盖语义色；主题与布局独立，提供对比度提示和单项恢复。</p></figcaption></figure><figure data-style="aurora" data-group="设置" hidden><a href="png/aurora/F13-settings-presets.png" target="_blank"><img src="png/aurora/F13-settings-presets.png" alt="极光 · 外观组合" loading="lazy"></a><figcaption><strong>F13 · 外观组合</strong><p>保存、应用、导入导出自己的布局、主题、尺寸和背景组合。</p></figcaption></figure><figure data-style="aurora" data-group="设置" hidden><a href="png/aurora/F14-settings-layout-recovery.png" target="_blank"><img src="png/aurora/F14-settings-layout-recovery.png" alt="极光 · 布局恢复" loading="lazy"></a><figcaption><strong>F14 · 布局恢复</strong><p>布局启用失败保留上次有效布局、未保存内容和任务，可进入插件管理恢复。</p></figcaption></figure><figure data-style="aurora" data-group="状态与适配" hidden><a href="png/aurora/G01-loading.png" target="_blank"><img src="png/aurora/G01-loading.png" alt="极光 · 工作区加载中" loading="lazy"></a><figcaption><strong>G01 · 工作区加载中</strong><p>先显示窗口和项目结构；局部渐进加载，取消操作始终可用。</p></figcaption></figure><figure data-style="aurora" data-group="状态与适配" hidden><a href="png/aurora/G02-file-error.png" target="_blank"><img src="png/aurora/G02-file-error.png" alt="极光 · 文件不可用" loading="lazy"></a><figcaption><strong>G02 · 文件不可用</strong><p>区分权限不足与路径失效，提供重试、重新定位和关闭标签。</p></figcaption></figure><figure data-style="aurora" data-group="状态与适配" hidden><a href="png/aurora/G03-sleep.png" target="_blank"><img src="png/aurora/G03-sleep.png" alt="极光 · 后台项目休眠" loading="lazy"></a><figcaption><strong>G03 · 后台项目休眠</strong><p>保留会话与未保存文档，停止可恢复的后台服务；切回时恢复。</p></figcaption></figure><figure data-style="aurora" data-group="状态与适配" hidden><a href="png/aurora/G04-focus.png" target="_blank"><img src="png/aurora/G04-focus.png" alt="极光 · 专注模式" loading="lazy"></a><figcaption><strong>G04 · 专注模式</strong><p>一次收起辅助区域，退出后恢复原布局。</p></figcaption></figure><figure data-style="aurora" data-group="状态与适配" hidden><a href="png/aurora/G05-dark.png" target="_blank"><img src="png/aurora/G05-dark.png" alt="极光 · 深色主题" loading="lazy"></a><figcaption><strong>G05 · 深色主题</strong><p>保持语义色、层级与对比度；不通过简单反色生成。</p></figcaption></figure><figure data-style="aurora" data-group="状态与适配" hidden><a href="png/aurora/G06-narrow.png" target="_blank"><img src="png/aurora/G06-narrow.png" alt="极光 · 窄窗口" loading="lazy"></a><figcaption><strong>G06 · 窄窗口</strong><p>侧栏变为可关闭浮层，AI 使用覆盖式面板；核心操作保留。</p></figcaption></figure><figure data-style="aurora" data-group="状态与适配" hidden><a href="png/aurora/G07-windows.png" target="_blank"><img src="png/aurora/G07-windows.png" alt="极光 · Windows 窗口" loading="lazy"></a><figcaption><strong>G07 · Windows 窗口</strong><p>使用 Windows 窗口控制和 Ctrl 系快捷键，功能结构与 macOS 一致。</p></figcaption></figure><figure data-style="aurora" data-group="设计规范" hidden><a href="png/aurora/H01-architecture.png" target="_blank"><img src="png/aurora/H01-architecture.png" alt="极光 · 信息架构" loading="lazy"></a><figcaption><strong>H01 · 信息架构</strong><p>工作区、项目、文件、工具与全局设置之间的关系。</p></figcaption></figure><figure data-style="aurora" data-group="设计规范" hidden><a href="png/aurora/H02-tokens.png" target="_blank"><img src="png/aurora/H02-tokens.png" alt="极光 · 视觉令牌" loading="lazy"></a><figcaption><strong>H02 · 视觉令牌</strong><p>颜色、字体、间距、圆角、层级与图标规范。</p></figcaption></figure><figure data-style="aurora" data-group="设计规范" hidden><a href="png/aurora/H03-components.png" target="_blank"><img src="png/aurora/H03-components.png" alt="极光 · 组件与反馈状态" loading="lazy"></a><figcaption><strong>H03 · 组件与反馈状态</strong><p>按钮、输入、开关、标签、菜单、通知及加载、禁用、错误状态。</p></figcaption></figure><figure data-style="aurora" data-group="设计规范" hidden><a href="png/aurora/H04-adaptive.png" target="_blank"><img src="png/aurora/H04-adaptive.png" alt="极光 · 响应式布局规则" loading="lazy"></a><figcaption><strong>H04 · 响应式布局规则</strong><p>固定尺寸、可拖动边界、面板最小宽度与收起优先级。</p></figcaption></figure><figure data-style="aurora" data-group="设计规范" hidden><a href="png/aurora/H05-flows.png" target="_blank"><img src="png/aurora/H05-flows.png" alt="极光 · 关键操作流程" loading="lazy"></a><figcaption><strong>H05 · 关键操作流程</strong><p>打开项目、审查改动、AI 协作、扩展启用四条主路径。</p></figcaption></figure></main><footer>PNG 点击查看原图。交互、任务状态及内容均为设计示例。</footer><script>const style=document.getElementById('style'),group=document.getElementById('group');function filter(){document.querySelectorAll('figure').forEach(f=>f.hidden=f.dataset.style!==style.value||(group.value!=='all'&&f.dataset.group!==group.value));document.getElementById('style-pdf').href='pdf/horizon-'+style.value+'.pdf';}style.onchange=filter;group.onchange=filter;</script></body></html>
